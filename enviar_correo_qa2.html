<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviando correo...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #004B87, #0066b3);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📧 Abriendo correo...</h2>
        <div class="spinner"></div>
        <p>Redirigiendo a tu cliente de correo</p>
    </div>

    <script>
        // Obtener parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const destinatario = params.get('destinatario') || '';
        const subject = params.get('subject') || '';
        const body = params.get('body') || '';

        // Construir mailto
        const mailtoLink = `mailto:${destinatario}?subject=${subject}&body=${body}`;

        // Redirigir inmediatamente
        window.location.href = mailtoLink;

        // Mensaje alternativo si no redirige
        setTimeout(() => {
            document.querySelector('.container').innerHTML = `
                <h2>✅ Listo</h2>
                <p style="margin-top:20px;">Si no se abrió tu cliente de correo automáticamente:</p>
                <a href="${mailtoLink}" style="display:inline-block; margin-top:20px; padding:12px 24px; background:white; color:#004B87; text-decoration:none; border-radius:6px; font-weight:700;">
                    📧 Hacer clic aquí
                </a>
            `;
        }, 2000);
    </script>
</body>
</html>
