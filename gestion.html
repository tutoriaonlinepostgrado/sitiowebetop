<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Gestión Tutorial - ETOP</title>
    <style>
        :root {
            --azul-fondo: #141b2d;
            --azul-sidebar: #1f2940;
            --amarillo-top: #ffd700;
            --texto-blanco: #ffffff;
            --texto-gris: #a3a3a3;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: var(--azul-fondo); }
        .app-container { display: flex; height: 100vh; width: 100vw; transition: all 0.3s ease; }
        .sidebar { width: 300px; background-color: var(--azul-sidebar); color: var(--texto-blanco); display: flex; flex-direction: column; border-right: 1px solid rgba(255, 215, 0, 0.1); z-index: 10; transition: margin-left 0.3s ease; flex-shrink: 0; overflow: hidden; }
        .sidebar.closed { margin-left: -300px; }
        .sidebar-header { padding: 25px 20px; border-bottom: 2px solid var(--amarillo-top); background-color: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--amarillo-top); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-header span { font-size: 12px; color: var(--texto-gris); display: block; margin-top: 5px; }
        .sidebar-menu { flex-grow: 1; overflow-y: auto; padding-bottom: 15px; }
        .sidebar-menu::-webkit-scrollbar { width: 5px; }
        .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
        .sidebar-menu::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.6); }
        .menu-category { padding: 15px 20px 5px 20px; font-size: 11px; text-transform: uppercase; color: var(--texto-gris); font-weight: 700; letter-spacing: 1px; }
        .menu-btn { background: none; border: none; color: #e0e0e0; padding: 12px 20px; text-align: left; font-size: 14px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px; width: 100%; text-decoration: none; box-sizing: border-box; }
        .menu-btn:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .menu-btn.active { background-color: rgba(255, 215, 0, 0.15); color: var(--amarillo-top); border-left: 4px solid var(--amarillo-top); font-weight: 600; }
        .btn-volver { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); color: var(--texto-gris); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.3s; flex-shrink: 0; background-color: var(--azul-sidebar); }
        .btn-volver:hover { color: var(--amarillo-top); background-color: rgba(0,0,0,0.2); }
        .collapsible-header { padding: 13px 20px; font-size: 14px; color: #e0e0e0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid transparent; transition: all 0.2s; user-select: none; }
        .collapsible-header:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .collapsible-header .header-left { display: flex; align-items: center; gap: 10px; }
        .collapsible-header .arrow { font-size: 10px; color: var(--texto-gris); transition: transform 0.25s ease; flex-shrink: 0; }
        .collapsible-header.open .arrow { transform: rotate(180deg); color: var(--amarillo-top); }
        .collapsible-header.open { color: var(--amarillo-top); background-color: rgba(255, 215, 0, 0.06); border-left: 4px solid rgba(255,215,0,0.3); }
        .collapsible-body { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
        .collapsible-body.open { max-height: 500px; }
        .collapsible-body .menu-btn { padding-left: 36px; font-size: 13px; color: #c0c0c0; border-left: 4px solid transparent; }
        .collapsible-body .menu-btn::before { content: '›'; color: rgba(255,215,0,0.4); font-size: 16px; margin-right: -4px; }
        .collapsible-body .menu-btn:hover { color: var(--amarillo-top); }
        .collapsible-body .menu-btn.active { color: var(--amarillo-top); border-left-color: var(--amarillo-top); }
        .content-area { flex-grow: 1; background-color: #F3F2F1; position: relative; display: flex; flex-direction: column; }
        .top-bar { background-color: var(--azul-sidebar); height: 50px; display: flex; align-items: center; padding-left: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; }
        .toggle-btn { background: none; border: none; color: var(--amarillo-top); font-size: 24px; cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
        .toggle-btn:hover { background-color: rgba(255,255,255,0.1); }
        iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>
                <h2>📋 Espacio Tutoría</h2>
                <span>Operación Diaria</span>
            </div>
            <button class="toggle-btn" onclick="toggleSidebar()" style="font-size: 18px;">✕</button>
        </div>

        <div class="sidebar-menu">
            <div class="menu-category">Operación Diaria</div>
            <button class="menu-btn active" onclick="cargar('DASHBOARD', this)">📊 Tablero de Gestión (App)</button>
            <button class="menu-btn" onclick="cargar('NOMINA_ESTUDIANTES', this)">📋 Nómina Estudiantes</button>
            <button class="menu-btn" onclick="cargar('CURSOS_ACTIVOS', this)">🟢 Cursos Activos</button>
            <button class="menu-btn" onclick="cargar('CURSOS_PREPARACION', this)">⏳ Cursos en Preparación</button>
            <button class="menu-btn" onclick="cargar('CURSOS_CIERRE', this)">🏁 Cursos en Cierre</button>
            <button class="menu-btn" onclick="cargar('FICHA_ESTUDIANTE', this)">👤 Ficha del Estudiante</button>
            <button class="menu-btn" onclick="cargar('SEMAFORO', this)">🚦 Reporte Semáforo</button>

            <div class="menu-category">Canales del Equipo</div>
            <div class="collapsible-header" id="header-canales" onclick="toggleCollapsible('canales')">
                <div class="header-left"><span>🟣</span><span>Canales SharePoint</span></div>
                <span class="arrow">▼</span>
            </div>
            <div class="collapsible-body" id="body-canales">
                <button class="menu-btn" onclick="cargar('CANAL_MEDICINA', this)">
                    🟣 Canal de Medicina
                </button>
            </div>

            <div class="menu-category">Herramientas</div>
            <a href="centro_herramientas_etop.html" target="_blank" class="menu-btn" title="Abrir Centro de Herramientas ETOP">
                ⚡ Centro de Herramientas ETOP ↗️
            </a>
            <a href="pantalladividida.html" target="_blank" class="menu-btn">
                🗂️ Asistente de Carga (Pop-up) ↗️
            </a>
            <a href="gestion_coordinacion.html" class="menu-btn">
                🏛️ Ir a Espacio Coordinación ↗️
            </a>
        </div>

        <a href="index.html" class="btn-volver">⬅️ Volver al Portal Principal</a>
    </div>

    <div class="content-area">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()" title="Abrir/Cerrar Menú">☰</button>
            <span style="margin-left: 15px; font-size: 14px; font-weight: 600;" id="titulo-vista">Vista de Reporte</span>
        </div>
        <iframe id="visor" title="Reporte" allowFullScreen="true"></iframe>
    </div>
</div>

<script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }

    function toggleCollapsible(nombre) {
        document.getElementById('header-' + nombre).classList.toggle('open');
        document.getElementById('body-' + nombre).classList.toggle('open');
    }

    const misReportes = {
        'DASHBOARD': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=f3645002c9a950410ee2&navContentPaneEnabled=false&filterPaneEnabled=false",
        'NOMINA_ESTUDIANTES': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=255c88d86191d22dd1c3&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CURSOS_ACTIVOS': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=9df5f2db687d901b71b9&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CURSOS_PREPARACION': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=75dcbe8308cd22de087d&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CURSOS_CIERRE': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=ab4e8f37a94c688a5869&navContentPaneEnabled=false&filterPaneEnabled=false",
        'FICHA_ESTUDIANTE': "https://app.powerbi.com/rdlEmbed?reportId=8d398d46-ce63-49bf-9f24-55f1e195bdb5&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'SEMAFORO': "https://app.powerbi.com/rdlEmbed?reportId=b5b9144d-ff71-40fb-bf8a-2b8fe12eddbd&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'CANAL_MEDICINA': "https://unabportal365.sharepoint.com/sites/actasynrc-ISPAB/Documentos%20compartidos/Forms/AllItems.aspx?id=%2Fsites%2Factasynrc%2DISPAB%2FDocumentos%20compartidos%2FMED%5FISPAB%5FMBAES&viewid=c5688d55%2Dc6d1%2D40cd%2D870d%2D7e26ee1117a4"
    };

    const titulosVista = {
        'DASHBOARD': 'Tablero de Gestión',
        'NOMINA_ESTUDIANTES': 'Nómina Estudiantes',
        'CURSOS_ACTIVOS': 'Cursos Activos',
        'CURSOS_PREPARACION': 'Cursos en Preparación',
        'CURSOS_CIERRE': 'Cursos en Cierre',
        'FICHA_ESTUDIANTE': 'Ficha del Estudiante',
        'SEMAFORO': 'Reporte Semáforo',
        'CANAL_MEDICINA': '🟣 Canal de Medicina — SharePoint'
    };

    function cargar(clave, btn) {
        const url = misReportes[clave];
        if (url) document.getElementById('visor').src = url;
        document.querySelectorAll('button.menu-btn, a.menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('titulo-vista').textContent = titulosVista[clave] || 'Vista de Reporte';
        if (window.innerWidth < 800) toggleSidebar();
    }

    window.onload = function() {
        const btnInicio = document.querySelector('.menu-btn.active');
        if (btnInicio) cargar('DASHBOARD', btnInicio);
    };
</script>
</body>
</html>
