<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espacio Tutoría - ETOP</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#141b2d;overflow:hidden}
#carga-etop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd700;font:600 13px 'Segoe UI',sans-serif;background:#141b2d}
</style>
</head>
<body>
<div id="carga-etop">Cargando Espacio Tutoría…</div>
<script>
(async()=>{
  try{
    const r=await fetch('gestion_base.html?v=20260911-kpi2',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const cierre='</bo'+'dy>';
    const script='<scr'+'ipt src="gestion_kpi.js?v=20260911-kpi2"></scr'+'ipt>';
    html=html.replace(cierre,script+cierre);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('carga-etop').textContent='No se pudo cargar el portal. Recarga la página.';
    console.error('Error cargando gestion_base.html:',e);
  }
})();
</script>
</body>
</html>
