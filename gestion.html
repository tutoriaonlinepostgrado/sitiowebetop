<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Gestión Tutorial - ETOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .sidebar.collapsed {
            transform: translateX(-280px);
        }
        .logo-section {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 28px;
        }
        .logo-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
        }
        .logo-subtitle {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
        }
        .menu {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }
        .menu::-webkit-scrollbar {
            width: 6px;
        }
        .menu::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .menu-category {
            padding: 15px 20px 8px 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }
        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .collapsible-header:hover {
            background: rgba(255,255,255,0.05);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left span:first-child {
            font-size: 18px;
        }
        .header-left span:last-child {
            font-size: 14px;
            font-weight: 500;
        }
        .arrow {
            font-size: 12px;
            transition: transform 0.3s;
        }
        .collapsible-header.active .arrow {
            transform: rotate(90deg);
        }
        .collapsible-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .collapsible-body.active {
            max-height: 500px;
        }
        .menu-btn, .canal-btn {
            display: block;
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            border-left: 3px solid transparent;
        }
        .menu-btn:hover, .canal-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        .menu-btn.active, .canal-btn.active {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-left-color: #3b82f6;
            font-weight: 500;
        }
        .footer-section {
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 12px 15px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            font-weight: 500;
        }
        .footer-btn:hover {
            background: rgba(251, 191, 36, 0.25);
            transform: translateY(-1px);
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            position: relative;
        }
        .topbar {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .menu-toggle:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .topbar h1 {
            font-size: 24px;
            color: #1e293b;
            font-weight: 600;
        }
        .iframe-container {
            flex: 1;
            padding: 20px;
            overflow: hidden;
        }
        #visor {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        #canal-splash {
            display: none;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            gap: 20px;
            color: #64748b;
        }
        #canal-splash.visible {
            display: flex;
        }
        #canal-splash .icon {
            font-size: 80px;
            opacity: 0.3;
        }
        #canal-splash .text {
            font-size: 18px;
            text-align: center;
        }
        @media (max-width: 800px) {
            .sidebar {
                position: absolute;
                height: 100vh;
                transform: translateX(-280px);
            }
            .sidebar.active {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo-section">
            <div class="logo-icon">📚</div>
            <div>
                <div class="logo-text">ESPACIO TUTORÍA</div>
                <div class="logo-subtitle">Operación Diaria</div>
            </div>
        </div>

        <div class="menu">
            <div class="menu-category">Operación Diaria</div>
            
            <button class="menu-btn" onclick="cargarReporte('DASHBOARD',this)">
                📊 Tablero de Gestión (App)
            </button>
            <button class="menu-btn" onclick="cargarReporte('NOMINA_ESTUDIANTES',this)">
                📋 Nómina Estudiantes
            </button>
            <button class="menu-btn" onclick="cargarReporte('CURSOS_ACTIVOS',this)">
                🟢 Cursos Activos
            </button>
            <button class="menu-btn" onclick="cargarReporte('CURSOS_PREPARACION',this)">
                🔨 Cursos en Preparación
            </button>
            <button class="menu-btn" onclick="cargarReporte('CURSOS_CIERRE',this)">
                🔴 Cursos en Cierre
            </button>
            <button class="menu-btn" onclick="cargarReporte('FICHA_ESTUDIANTE',this)">
                🎓 Ficha del Estudiante
            </button>
            <button class="menu-btn" onclick="cargarReporte('SEMAFORO',this)">
                🚦 Reporte Semáforo
            </button>

            <div class="menu-category">Onboarding</div>
            
            <div class="collapsible-header" id="header-onboarding" onclick="toggleCollapsible('onboarding')">
                <div class="header-left"><span>📝</span><span>Generación de Correos</span></div>
                <div class="arrow">▶</div>
            </div>
            <div class="collapsible-body" id="body-onboarding">
                <button class="menu-btn" onclick="cargarOnboarding('CORREOS',this)">
                    📧 Correos de Bienvenida
                </button>
                <button class="menu-btn" onclick="cargarOnboarding('INVITACIONES',this)">
                    📅 Invitación Sesión Sincrónica
                </button>
            </div>

            <div class="menu-category">Canales del Equipo</div>
            
            <div class="collapsible-header" id="header-canales" onclick="toggleCollapsible('canales')">
                <div class="header-left"><span>🟣</span><span>Canales SharePoint</span></div>
                <div class="arrow">▶</div>
            </div>
            <div class="collapsible-body" id="body-canales">
                <button class="canal-btn" onclick="abrirEnlaceExterno('https://unab.sharepoint.com/sites/ETOP',this)">
                    📌 Canal Principal
                </button>
            </div>
        </div>

        <div class="footer-section">
            <button class="footer-btn" onclick="irEspacioCoordinacion()">
                🏛️ Ir a Espacio Coordinación →
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h1 id="titulo-vista">Portal de Gestión Tutorial</h1>
            </div>
        </div>

        <div class="iframe-container">
            <div id="canal-splash" class="visible">
                <div class="icon">📊</div>
                <div class="text">Selecciona un reporte del menú lateral para comenzar</div>
            </div>
            <iframe id="visor" style="display: none;"></iframe>
        </div>
    </div>

    <script>
    const misReportes = {
        'DASHBOARD': "https://app.powerbi.com/view?r=eyJrIjoiNTc2MzJlZGEtYzg2Yi00ZTQ3LWFlYWItMWEwNmQ4NjY3YjNiIiwidCI6IjhmYmVkMzkzLWQwM2ItNDlmOC1iZTc5LWNkNWUxZjU5MGZiMiJ9",
        'NOMINA_ESTUDIANTES': "https://app.powerbi.com/view?r=eyJrIjoiNzBiMTFlMTYtMzViNi00NWM1LWE0YzEtMDRmNGFhYWVhNzRkIiwidCI6IjhmYmVkMzkzLWQwM2ItNDlmOC1iZTc5LWNkNWUxZjU5MGZiMiJ9",
        'CURSOS_ACTIVOS': "https://app.powerbi.com/view?r=eyJrIjoiOGI5ZDllMDgtYTE3My00NzcwLWI3MWItNTEzNzhmZTk5OWQ5IiwidCI6IjhmYmVkMzkzLWQwM2ItNDlmOC1iZTc5LWNkNWUxZjU5MGZiMiJ9",
        'CURSOS_PREPARACION': "https://app.powerbi.com/view?r=eyJrIjoiMDE1MzFjZjMtNmJhOS00ZGIwLTljMTUtZGZjZDNkMzhhMGRjIiwidCI6IjhmYmVkMzkzLWQwM2ItNDlmOC1iZTc5LWNkNWUxZjU5MGZiMiJ9",
        'CURSOS_CIERRE': "https://app.powerbi.com/view?r=eyJrIjoiOTc2M2ZlZTQtMzg1Yi00OTY3LTkzYmMtYWJhZTdkZjY2MGI2IiwidCI6IjhmYmVkMzkzLWQwM2ItNDlmOC1iZTc5LWNkNWUxZjU5MGZiMiJ9",
        'FICHA_ESTUDIANTE': "https://app.powerbi.com/rdlEmbed?reportId=8d398d46-ce63-49bf-9f24-55f1e195bdb5&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'SEMAFORO': "https://app.powerbi.com/rdlEmbed?reportId=b5b9144d-ff71-40fb-bf8a-2b8fe12eddbd&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'CORREOS': "onboarding_correos.html",
        'INVITACIONES': "onboarding_invitaciones.html"
    };

    const titulos = {
        'DASHBOARD':'Tablero de Gestión','NOMINA_ESTUDIANTES':'Nómina Estudiantes',
        'CURSOS_ACTIVOS':'Cursos Activos','CURSOS_PREPARACION':'Cursos en Preparación',
        'CURSOS_CIERRE':'Cursos en Cierre','FICHA_ESTUDIANTE':'Ficha del Estudiante',
        'SEMAFORO':'Reporte Semáforo',
        'CORREOS':'📧 Generador de Correos de Bienvenida',
        'INVITACIONES':'📅 Envío Invitación Sesión Sincrónica'
    };

    function cargarReporte(clave, btn) {
        document.getElementById('canal-splash').classList.remove('visible');
        document.getElementById('visor').style.display = 'block';
        const url = misReportes[clave];
        if (url) document.getElementById('visor').src = url;
        document.querySelectorAll('.menu-btn, .canal-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('titulo-vista').textContent = titulos[clave] || 'Vista de Reporte';
        if (window.innerWidth < 800) toggleSidebar();
    }

    function cargarOnboarding(clave, btn) {
        document.getElementById('canal-splash').classList.remove('visible');
        document.getElementById('visor').style.display = 'block';
        const url = misReportes[clave];
        if (url) document.getElementById('visor').src = url;
        document.querySelectorAll('.menu-btn, .canal-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('titulo-vista').textContent = titulos[clave] || 'Vista de Reporte';
        if (window.innerWidth < 800) toggleSidebar();
    }

    function abrirEnlaceExterno(url, btn) {
        window.open(url, '_blank');
        document.querySelectorAll('.menu-btn, .canal-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleCollapsible(section) {
        const header = document.getElementById('header-' + section);
        const body = document.getElementById('body-' + section);
        header.classList.toggle('active');
        body.classList.toggle('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function irEspacioCoordinacion() {
        window.location.href = 'gestion_coordinacion.html';
    }
    </script>
</body>
</html>
