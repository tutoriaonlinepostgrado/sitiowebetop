<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Gestión Tutorial - ETOP</title>
    <style>
        :root {
            --azul-fondo: #141b2d;
            --azul-sidebar: #1f2940;
            --amarillo-top: #ffd700;
            --texto-blanco: #ffffff;
            --texto-gris: #a3a3a3;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: var(--azul-fondo); }
        
        .app-container { display: flex; height: 100vh; width: 100vw; transition: all 0.3s ease; }

        /* --- BARRA LATERAL (MENU) --- */
        .sidebar {
            width: 300px;
            background-color: var(--azul-sidebar);
            color: var(--texto-blanco);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 215, 0, 0.1);
            z-index: 10;
            overflow-y: auto;
            transition: margin-left 0.3s ease; /* Animación suave */
            flex-shrink: 0; /* Evita que se aplaste */
        }

        /* Clase para esconder el menú */
        .sidebar.closed {
            margin-left: -300px; /* Lo mueve fuera de la pantalla */
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 2px solid var(--amarillo-top);
            margin-bottom: 10px;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--amarillo-top); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-header span { font-size: 12px; color: var(--texto-gris); display: block; margin-top: 5px; }

        /* Categorías */
        .menu-category {
            padding: 15px 20px 5px 20px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--texto-gris);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Botones del Menú */
        .menu-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            padding: 12px 20px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-decoration: none; /* Para los enlaces <a> */
            box-sizing: border-box;
        }

        .menu-btn:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        
        .menu-btn.active {
            background-color: rgba(255, 215, 0, 0.15);
            color: var(--amarillo-top);
            border-left: 4px solid var(--amarillo-top);
            font-weight: 600;
        }

        .btn-config {
            background: none; border: none; color: #64748b; padding: 12px; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .btn-config:hover { color: var(--amarillo-top); }

        .btn-volver {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--texto-gris);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-volver:hover { color: var(--amarillo-top); background-color: rgba(0,0,0,0.2); }

        /* --- ÁREA DE CONTENIDO --- */
        .content-area { 
            flex-grow: 1; 
            background-color: #F3F2F1; 
            position: relative; 
            display: flex;
            flex-direction: column;
        }

        /* BARRA SUPERIOR DEL CONTENIDO (Para el botón de abrir) */
        .top-bar {
            background-color: var(--azul-sidebar); /* Mismo color del menú */
            height: 50px;
            display: flex;
            align-items: center;
            padding-left: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
        }

        /* Botón Toggle (Hamburguesa) */
        .toggle-btn {
            background: none;
            border: none;
            color: var(--amarillo-top);
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .toggle-btn:hover { background-color: rgba(255,255,255,0.1); }
        
        iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }

        /* --- MODAL SELECTOR DE COORDINADOR --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: #1f2940; padding: 30px; border-radius: 12px; border-top: 4px solid #ffd700;
            width: 320px; text-align: center; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-family: 'Segoe UI', sans-serif;
        }
        .modal-box h3 { margin-top: 0; color: #ffd700; }
        .modal-box p { font-size: 13px; color: #cbd5e1; margin-bottom: 20px; }
        .modal-box select {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px;
            background: #0f172a; color: white; border: 1px solid #334155; font-size: 14px;
        }
        .modal-btn {
            background: #ffd700; color: #141b2d; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; transition: 0.2s;
        }
        .modal-btn:hover { background: #eab308; }
        .modal-close {
            background: none; border: none; color: #64748b; margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 12px;
        }
        .modal-close:hover { color: white; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>
                <h2>⚙️ Gestión Tutorial</h2>
                <span>Centro de Operaciones</span>
            </div>
            <button class="toggle-btn" onclick="toggleSidebar()" style="font-size: 18px;">✕</button>
        </div>

        <!-- SECCIÓN 1: OPERACIÓN DIARIA -->
        <div class="menu-category">Operación Diaria</div>
        
        <button class="menu-btn active" onclick="cargar('DASHBOARD', this)">
            📊 Tablero de Gestión (App)
        </button>

        <button class="menu-btn" onclick="cargar('CURSOS_ACTIVOS', this)">
            🟢 Cursos Activos
        </button>

        <button class="menu-btn" onclick="cargar('CURSOS_PREPARACION', this)">
            ⏳ Cursos en Preparación
        </button>

        <button class="menu-btn" onclick="cargar('CURSOS_CIERRE', this)">
            🏁 Cursos en Cierre
        </button>

        <button class="menu-btn" onclick="cargar('FICHA_ESTUDIANTE', this)">
            👤 Ficha del Estudiante
        </button>

        <button class="menu-btn" onclick="cargar('SEMAFORO', this)">
            🚦 Reporte Semáforo
        </button>


        <!-- SECCIÓN 2: ESPACIO COORDINACIÓN -->
        <div class="menu-category">Espacio Coordinación</div>

        <button class="menu-btn" onclick="cargar('CARGA_TUTORIAL', this)">
            ⚖️ Carga Tutorial
        </button>

        <button class="menu-btn" onclick="cargar('RESUMEN_SEMAFORO', this)">
            📈 Resumen Semáforo
        </button>

        <!-- NUEVO BOTÓN: EXCEL DE NÓMINAS CON ENGRANAJE DE CONFIGURACIÓN -->
        <div style="display: flex; align-items: center; width: 100%;">
            <button class="menu-btn" onclick="abrirMiExcel()" style="flex-grow: 1; padding-right: 0;">
                📗 Mi Excel de Nóminas ↗️
            </button>
            <button class="btn-config" onclick="mostrarModalCoordinador()" title="Configurar / Cambiar de Coordinador">⚙️</button>
        </div>

        <!-- ENLACE EXTERNO A LA PANTALLA DIVIDIDA CORREGIDO PARA GITHUB -->
        <a href="pantalladividida.html" target="_blank" class="menu-btn">
            🗂️ Asistente de Carga (Pop-up) ↗️
        </a>


        <!-- SECCIÓN 3: REPORTES DETALLADOS -->
        <div class="menu-category">Reportes Detallados</div>

        <button class="menu-btn" onclick="cargar('CURSOS_INICIAR', this)">
            🚀 Cursos Por Iniciar
        </button>
        
        <button class="menu-btn" onclick="cargar('REPORTE_NRC', this)">
            📑 Reporte por NRC
        </button>

        <button class="menu-btn" onclick="cargar('BASE_SEGUIMIENTO', this)">
            💾 Estado Base Seguimiento
        </button>

        <!-- SECCIÓN 4: CALIDAD -->
        <div class="menu-category">Calidad</div>

        <button class="menu-btn" onclick="cargar('CALENDARIOS', this)">
            📅 Calendarios
        </button>

        <button class="menu-btn" onclick="cargar('INCIDENCIAS_MASTER', this)">
            ⚠️ Incidencias por Master
        </button>

        <button class="menu-btn" onclick="cargar('INCIDENCIAS_NRC', this)">
            ⚠️ Incidencias por NRC
        </button>

        <a href="index.html" class="btn-volver">
            ⬅️ Volver al Portal Principal
        </a>
    </div>

    <div class="content-area">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()" title="Abrir/Cerrar Menú">☰</button>
            <span style="margin-left: 15px; font-size: 14px; font-weight: 600;">Vista de Reporte</span>
        </div>

        <iframe id="visor" title="Reporte" allowFullScreen="true"></iframe>
    </div>

</div>

<!-- VENTANA FLOTANTE (MODAL) PARA SELECCIONAR COORDINADOR -->
<div class="modal-overlay" id="modalCoordinador">
    <div class="modal-box">
        <h3>👋 ¡Hola Coordinador!</h3>
        <p>Selecciona tu nombre para que el sistema recuerde y abra siempre tu Excel personal.</p>
        
        <select id="selectCoordinador">
            <option value="" disabled selected>-- Elige tu nombre --</option>
            <option value="Carolina">Carolina</option>
            <option value="Daniela">Daniela</option>
            <option value="Miguel">Miguel</option>
            <option value="Pablo">Pablo</option>
            <option value="Querida Rita">Querida Rita</option>
        </select>

        <button class="modal-btn" onclick="guardarYabrirExcel()">Guardar y Abrir Excel</button>
        <button class="modal-close" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    // --- FUNCIÓN PARA ESCONDER/MOSTRAR MENÚ ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('closed');
    }

    // --- ENLACES TRANSFORMADOS Y CORREGIDOS DEFINITIVOS ---
    const misReportes = {
        'DASHBOARD': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&navContentPaneEnabled=false&filterPaneEnabled=false",
        
        // --- ESTADOS DE CURSOS (Usando reportEmbed + el ID exacto de la hoja sin "ReportSection") ---
        'CURSOS_ACTIVOS': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=9df5f2db687d901b71b9&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CURSOS_PREPARACION': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=75dcbe8308cd22de087d&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CURSOS_CIERRE': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=ab4e8f37a94c688a5869&navContentPaneEnabled=false&filterPaneEnabled=false",

        // --- ESPACIO COORDINACIÓN (Usando reportEmbed + el ID exacto de la hoja sin "ReportSection") ---
        'CARGA_TUTORIAL': "https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=92a9ea4e356075d5089e&navContentPaneEnabled=false&filterPaneEnabled=false",
        'RESUMEN_SEMAFORO': "https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=13a801ce8ba0312ed355&navContentPaneEnabled=false&filterPaneEnabled=false",

        // --- REPORTES PAGINADOS (RDL) ---
        'FICHA_ESTUDIANTE': "https://app.powerbi.com/rdlEmbed?reportId=8d398d46-ce63-49bf-9f24-55f1e195bdb5&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'SEMAFORO': "https://app.powerbi.com/rdlEmbed?reportId=b5b9144d-ff71-40fb-bf8a-2b8fe12eddbd&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'CALENDARIOS': "https://app.powerbi.com/rdlEmbed?reportId=94fc6064-322a-48be-9968-27fe00ee8ae0&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'CURSOS_INICIAR': "https://app.powerbi.com/rdlEmbed?reportId=2d95ad06-3811-4fba-a187-7e1e8f2ea61c&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'REPORTE_NRC': "https://app.powerbi.com/rdlEmbed?reportId=a0026236-1552-4a2d-bdc8-ee487be7de93&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'INCIDENCIAS_MASTER': "https://app.powerbi.com/rdlEmbed?reportId=42ddd2bd-2af5-4354-9c11-4f9f20c0805c&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'INCIDENCIAS_NRC': "https://app.powerbi.com/rdlEmbed?reportId=eda17000-5679-49f5-bc46-41cfff1bcb95&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'BASE_SEGUIMIENTO': "https://app.powerbi.com/rdlEmbed?reportId=72cf6f52-dfa3-4cba-92f4-6a8c5c8ccf8e&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi"
    };

    function cargar(clave, btn) {
        const url = misReportes[clave];
        if(url) document.getElementById('visor').src = url;
        
        document.querySelectorAll('button.menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if(window.innerWidth < 800) toggleSidebar();
    }

    // ==========================================
    // LÓGICA DEL SELECTOR DE EXCEL PARA COORDINADORES
    // ==========================================

    // Mapeo exacto de los archivos con sus URLs completas de SharePoint
    const archivosCoordinadores = {
        "Carolina": "https://unabportal365.sharepoint.com/:x:/r/sites/actasynrc/Documentos%20compartidos/Canal%20General%20ETOP/DOCUMENTOS%20CANVAS/FLUJOS/Estudiantes%20a%20base/subir_estudiantes_desdeweb_Carola.xlsx?d=wcc26880a121e4d94a29cd573e6f69da8&csf=1&web=1&e=nlvce6",
        "Daniela": "https://unabportal365.sharepoint.com/:x:/r/sites/actasynrc/Documentos%20compartidos/Canal%20General%20ETOP/DOCUMENTOS%20CANVAS/FLUJOS/Estudiantes%20a%20base/subir_estudiantes_desdeweb_Daniela.xlsx?d=w43ebd8f7a27646e8a147cfa598572643&csf=1&web=1&e=XhS63X",
        "Miguel": "https://unabportal365.sharepoint.com/:x:/r/sites/actasynrc/Documentos%20compartidos/Canal%20General%20ETOP/DOCUMENTOS%20CANVAS/FLUJOS/Estudiantes%20a%20base/subir_estudiantes_desdeweb_miguel.xlsx?d=we8ec845160e8418a96d22fde9492238c&csf=1&web=1&e=98C2Dp",
        "Pablo": "https://unabportal365.sharepoint.com/:x:/r/sites/actasynrc/Documentos%20compartidos/Canal%20General%20ETOP/DOCUMENTOS%20CANVAS/FLUJOS/Estudiantes%20a%20base/subir_estudiantes_desdeweb_Pablo.xlsx?d=w31ef4ad8a0d94d0a8c1cb6179ef2a714&csf=1&web=1&e=nh5Yyo",
        "Querida Rita": "https://unabportal365.sharepoint.com/:x:/r/sites/actasynrc/Documentos%20compartidos/Canal%20General%20ETOP/DOCUMENTOS%20CANVAS/FLUJOS/Estudiantes%20a%20base/subir_estudiantes_desdeweb_Rita.xlsx?d=w3016b6bb82ed4834bb6781bfe65022ff&csf=1&web=1&e=4rkMqq"
    };

    function abrirMiExcel() {
        const nombreGuardado = localStorage.getItem('etop_nombreCoordinador');
        
        if (nombreGuardado && archivosCoordinadores[nombreGuardado]) {
            // Ya sabemos quién es, abrimos su URL exacta guardada en el sistema
            window.open(archivosCoordinadores[nombreGuardado], '_blank');
        } else {
            // No sabemos quién es, mostramos el modal
            mostrarModalCoordinador();
        }
    }

    function mostrarModalCoordinador() {
        document.getElementById('modalCoordinador').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalCoordinador').style.display = 'none';
    }

    function guardarYabrirExcel() {
        const select = document.getElementById('selectCoordinador');
        const nombreSeleccionado = select.value;
        
        if (nombreSeleccionado) {
            // Guardar en la memoria del navegador
            localStorage.setItem('etop_nombreCoordinador', nombreSeleccionado);
            
            // Cerrar el modal
            cerrarModal();
            
            // Abrir el Excel directamente
            window.open(archivosCoordinadores[nombreSeleccionado], '_blank');
        } else {
            alert("Por favor, selecciona tu nombre de la lista antes de continuar.");
        }
    }
</script>
</body>
</html>
