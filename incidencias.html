<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias ETOP</title>
</head>

<body>
  <main>
    <h1>Incidencias ETOP</h1>
    <p id="estadoCarga">Cargando datos...</p>
  </main>

  <script>
    async function cargarDatos() {
      const [respCursos, respIncidencias] = await Promise.all([
        fetch("./nrcs.json"),
        fetch("./incidencias.json")
      ]);

      if (!respCursos.ok) {
        throw new Error(`Error cargando nrcs.json: ${respCursos.status}`);
      }

      if (!respIncidencias.ok) {
        throw new Error(
          `Error cargando incidencias.json: ${respIncidencias.status}`
        );
      }

      const cursos = await respCursos.json();
      const incidencias = await respIncidencias.json();

      const incidenciasPorCurso = new Map();

      for (const incidencia of incidencias) {
        const clave = String(incidencia.cursoId ?? "");

        if (!clave) continue;

        if (!incidenciasPorCurso.has(clave)) {
          incidenciasPorCurso.set(clave, []);
        }

        incidenciasPorCurso.get(clave).push(incidencia);
      }

      const cursosConIncidencias = cursos.map(curso => {
        const registros =
          incidenciasPorCurso.get(String(curso.id)) ?? [];

        const conIncidencia = registros.filter(
          item => item.qaIncidencias === "CON INCIDENCIA"
        );

        return {
          ...curso,
          incidencias: registros,
          totalRegistrosQA2: registros.length,
          totalConIncidencia: conIncidencia.length,
          totalSinIncidencia: registros.filter(
            item => item.qaIncidencias === "SIN INCIDENCIA"
          ).length,
          pendientes: conIncidencia.filter(
            item => item.estadoIncidencia === "PENDIENTE"
          ).length,
          corregidas: conIncidencia.filter(
            item => item.estadoIncidencia === "CORREGIDA"
          ).length,
          derivadas: conIncidencia.filter(
            item => item.estadoIncidencia === "DERIVADO"
          ).length
        };
      });

      document.getElementById("estadoCarga").textContent =
        `${cursos.length.toLocaleString("es-CL")} cursos y ` +
        `${incidencias.length.toLocaleString("es-CL")} registros QA2 cargados`;

      console.log("Cursos relacionados:", cursosConIncidencias);
    }

    cargarDatos().catch(error => {
      console.error(error);

      document.getElementById("estadoCarga").textContent =
        `Error al cargar los datos: ${error.message}`;
    });
  </script>
</body>
</html>
