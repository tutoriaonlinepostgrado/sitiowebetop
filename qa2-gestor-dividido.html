<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA2 Gestor - ETOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #19202E;
        }
        
        .top-bar {
            height: 55px;
            background-color: #0f172a;
            color: #facc15;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 10;
            position: relative;
        }
        
        .top-bar-title { 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.1rem;
        }
        
        .btn-back {
            background-color: #facc15; 
            color: #0f172a; 
            text-decoration: none;
            padding: 8px 18px; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 0.85rem; 
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        
        .btn-back:hover { 
            background-color: #eab308; 
            transform: translateY(-1px);
        }
        
        .main-container { 
            height: calc(100% - 55px); 
            width: 100%; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background-color: #ffffff; 
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-title">
            📊 QA2 Gestor - Incidencias
        </div>
        <a href="index.html" class="btn-back">Volver al Portal</a>
    </div>
    
    <div class="main-container">
        <iframe 
            title="tableros_postgrados - QA2"
            src="https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&pageName=c7cb331250d18b546eb4&navContentPaneEnabled=false&filterPaneEnabled=false&toolbarEnabled=false"
            allowfullscreen="true">
        </iframe>
    </div>
</body>
</html>
