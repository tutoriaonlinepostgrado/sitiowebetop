name: Fix Carga Tutorial filter reload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix_carga_filter_reload.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch coordination page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gestion_coordinacion.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('carga_tutorial.html?embedded=1&v=20260917-drilldown2','carga_tutorial.html?embedded=1&v=20260917-filterfix2')
          needle = "if (url) document.getElementById('visor').src = url;"
          repl = "if (url) { const u=new URL(url,window.location.href); if(misReportes[claveActual]&&misReportes[claveActual].tipo==='local') u.searchParams.set('_fresh',Date.now().toString()); document.getElementById('visor').src=u.toString(); }"
          if needle not in s:
              raise SystemExit('No se encontró la línea de refresco del iframe')
          s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "ETOP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add gestion_coordinacion.html
          git commit -m "Forzar recarga de Carga Tutorial al filtrar"
          git push
