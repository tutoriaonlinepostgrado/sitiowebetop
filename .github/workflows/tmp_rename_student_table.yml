name: Temporary rename student table

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_rename_student_table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename exported Excel table
        shell: python
        run: |
          from pathlib import Path
          p = Path('centro_herramientas_etop.html')
          text = p.read_text(encoding='utf-8')
          old = 'name="TablaEstudiantes" displayName="TablaEstudiantes"'
          new = 'name="TablaEstudiantes3" displayName="TablaEstudiantes3"'
          if old not in text:
              raise SystemExit('Target table name not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add centro_herramientas_etop.html
          git commit -m "Rename student export table to TablaEstudiantes3"
          git push
