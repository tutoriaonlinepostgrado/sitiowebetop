name: Fix ETOP Coordinacion link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_etop_drilldown.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Carga Tutorial local URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gestion_coordinacion.html')
          text = p.read_text(encoding='utf-8')
          bad = 'url: \\"https://tutoriaonlinepostgrado.github.io/sitiowebetop/carga_tutorial.html?embedded=1&v=20260917-drilldown2\\"'
          good = 'url: "https://tutoriaonlinepostgrado.github.io/sitiowebetop/carga_tutorial.html?embedded=1&v=20260917-drilldown2"'
          if bad not in text:
              raise SystemExit('No se encontró la URL escapada a corregir')
          text = text.replace(bad, good, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "ETOP Automation"
          git config user.email "actions@users.noreply.github.com"
          git add gestion_coordinacion.html
          git commit -m "Corregir enlace local de Carga Tutorial en Coordinacion"
          git push
