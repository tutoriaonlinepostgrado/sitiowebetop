name: Temporary patch NRC_COD_CAL_FILTRO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_patch_nrc_cod_cal_filtro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add NRC_COD_CAL_FILTRO to exported student files
        shell: python
        run: |
          from pathlib import Path

          path = Path('centro_herramientas_etop.html')
          text = path.read_text(encoding='utf-8')
          old = """function exportXLSXConTabla(rows,filename){
  if(!rows||!rows.length)return;const cols=Object.keys(rows[0]);const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Estudiantes');"""
          new = """function exportXLSXConTabla(rows,filename){
  if(!rows||!rows.length)return;
  rows=rows.map(r=>{const nrcCod=String(r.NRC_COD||'').trim(),periodo=String(r.PERIODO||'').trim();return {...r,NRC_COD_CAL_FILTRO:(nrcCod&&periodo)?`${nrcCod}_${periodo}`:''};});
  const cols=Object.keys(rows[0]);const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Estudiantes');"""
          if old not in text:
              raise SystemExit('Target exportXLSXConTabla signature not found; no changes written.')
          if 'NRC_COD_CAL_FILTRO' in text:
              raise SystemExit('NRC_COD_CAL_FILTRO already exists; no changes written.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add centro_herramientas_etop.html
          git commit -m "Add NRC_COD_CAL_FILTRO to student formatter exports"
          git push
