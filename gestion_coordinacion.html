<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Coordinación - ETOP</title>
    <style>
        :root {
            --azul-fondo: #141b2d;
            --azul-sidebar: #1f2940;
            --amarillo-top: #ffd700;
            --texto-blanco: #ffffff;
            --texto-gris: #a3a3a3;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: var(--azul-fondo); }
        .app-container { display: flex; height: 100vh; width: 100vw; transition: all 0.3s ease; }
        .sidebar { width: 300px; background-color: var(--azul-sidebar); color: var(--texto-blanco); display: flex; flex-direction: column; border-right: 1px solid rgba(255, 215, 0, 0.1); z-index: 10; transition: margin-left 0.3s ease; flex-shrink: 0; overflow: hidden; }
        .sidebar.closed { margin-left: -300px; }
        .sidebar-header { padding: 25px 20px; border-bottom: 2px solid var(--amarillo-top); background-color: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--amarillo-top); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-header span { font-size: 12px; color: var(--texto-gris); display: block; margin-top: 5px; }
        .sidebar-menu { flex-grow: 1; overflow-y: auto; padding-bottom: 15px; }
        .sidebar-menu::-webkit-scrollbar { width: 5px; }
        .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
        .sidebar-menu::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.6); }
        .menu-category { padding: 15px 20px 5px 20px; font-size: 11px; text-transform: uppercase; color: var(--texto-gris); font-weight: 700; letter-spacing: 1px; }
        .menu-btn { background: none; border: none; color: #e0e0e0; padding: 12px 20px; text-align: left; font-size: 14px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px; width: 100%; text-decoration: none; box-sizing: border-box; }
        .menu-btn:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .menu-btn.active { background-color: rgba(255, 215, 0, 0.15); color: var(--amarillo-top); border-left: 4px solid var(--amarillo-top); font-weight: 600; }
        .btn-volver { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); color: var(--texto-gris); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.3s; flex-shrink: 0; background-color: var(--azul-sidebar); }
        .btn-volver:hover { color: var(--amarillo-top); background-color: rgba(0,0,0,0.2); }
        .collapsible-header { padding: 13px 20px; font-size: 14px; color: #e0e0e0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid transparent; transition: all 0.2s; user-select: none; }
        .collapsible-header:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .collapsible-header .header-left { display: flex; align-items: center; gap: 10px; }
        .collapsible-header .arrow { font-size: 10px; color: var(--texto-gris); transition: transform 0.25s ease; flex-shrink: 0; }
        .collapsible-header.open .arrow { transform: rotate(180deg); color: var(--amarillo-top); }
        .collapsible-header.open { color: var(--amarillo-top); background-color: rgba(255, 215, 0, 0.06); border-left: 4px solid rgba(255,215,0,0.3); }
        .collapsible-body { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
        .collapsible-body.open { max-height: 500px; }
        .collapsible-body .menu-btn { padding-left: 36px; font-size: 13px; color: #c0c0c0; border-left: 4px solid transparent; }
        .collapsible-body .menu-btn::before { content: '›'; color: rgba(255,215,0,0.4); font-size: 16px; margin-right: -4px; }
        .collapsible-body .menu-btn:hover { color: var(--amarillo-top); }
        .collapsible-body .menu-btn.active { color: var(--amarillo-top); border-left-color: var(--amarillo-top); }
        .content-area { flex-grow: 1; background-color: #F3F2F1; position: relative; display: flex; flex-direction: column; }
        .top-bar { background-color: var(--azul-sidebar); height: 50px; display: flex; align-items: center; padding-left: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; }
        .toggle-btn { background: none; border: none; color: var(--amarillo-top); font-size: 24px; cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; }
        .toggle-btn:hover { background-color: rgba(255,255,255,0.1); }
        iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
        .btn-tutoria {
            margin: 12px 15px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
            border: 1px solid rgba(34,197,94,0.4);
            border-radius: 8px;
            color: #4ade80;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-tutoria:hover { background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(34,197,94,0.1)); border-color: #22c55e; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>
                <h2>🏛️ Coordinación</h2>
                <span>Espacio de Coordinación</span>
            </div>
            <button class="toggle-btn" onclick="toggleSidebar()" style="font-size: 18px;">✕</button>
        </div>

        <div class="sidebar-menu">
            <div class="menu-category">Espacio Coordinación</div>
            <button class="menu-btn active" onclick="cargar('DASHBOARD_MACRO', this)">🏛️ Dashboard Macro Facultades</button>
            <button class="menu-btn" onclick="cargar('REPORTE_INDUCCION', this)">📝 Reporte Inducción</button>
            <button class="menu-btn" onclick="cargar('CARGA_TUTORIAL', this)">⚖️ Carga Tutorial</button>
            <button class="menu-btn" onclick="cargar('RESUMEN_SEMAFORO', this)">📈 Resumen Semáforo</button>

            <div class="menu-category">Reportes Detallados</div>
            <div class="collapsible-header" id="header-reportes" onclick="toggleCollapsible('reportes')">
                <div class="header-left"><span>📑</span><span>Reportes Detallados</span></div>
                <span class="arrow">▼</span>
            </div>
            <div class="collapsible-body" id="body-reportes">
                <button class="menu-btn" onclick="cargar('CURSOS_INICIAR', this)">🚀 Cursos Por Iniciar</button>
                <button class="menu-btn" onclick="cargar('REPORTE_NRC', this)">📑 Reporte por NRC</button>
                <button class="menu-btn" onclick="cargar('BASE_SEGUIMIENTO', this)">💾 Estado Base Seguimiento</button>
            </div>

            <div class="menu-category">Calidad</div>
            <div class="collapsible-header" id="header-calidad" onclick="toggleCollapsible('calidad')">
                <div class="header-left"><span>✅</span><span>Calidad</span></div>
                <span class="arrow">▼</span>
            </div>
            <div class="collapsible-body" id="body-calidad">
                <button class="menu-btn" onclick="cargar('CALENDARIOS', this)">📅 Calendarios</button>
                <button class="menu-btn" onclick="cargar('INCIDENCIAS_MASTER', this)">⚠️ Incidencias por Master</button>
                <button class="menu-btn" onclick="cargar('INCIDENCIAS_NRC', this)">⚠️ Incidencias por NRC</button>
            </div>

            <div class="menu-category">Herramientas</div>
            <a href="centro_herramientas_etop.html" target="_blank" class="menu-btn">
                ⚡ Centro de Herramientas ETOP ↗️
            </a>
            <a href="pantalladividida.html" target="_blank" class="menu-btn">
                🗂️ Asistente de Carga (Pop-up) ↗️
            </a>

            <div class="menu-category"> </div>
            <a href="gestion.html" class="btn-tutoria">
                📋 Ir a Espacio Tutoría →
            </a>
        </div>

        <a href="index.html" class="btn-volver">⬅️ Volver al Portal Principal</a>
    </div>

    <div class="content-area">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()" title="Abrir/Cerrar Menú">☰</button>
            <span style="margin-left: 15px; font-size: 14px; font-weight: 600;" id="titulo-vista">Vista de Reporte</span>
        </div>
        <iframe id="visor" title="Reporte" allowFullScreen="true"></iframe>
    </div>
</div>

<script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }

    function toggleCollapsible(nombre) {
        document.getElementById('header-' + nombre).classList.toggle('open');
        document.getElementById('body-' + nombre).classList.toggle('open');
    }

    const misReportes = {
        'DASHBOARD_MACRO': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=7a41932f4078dbccf8cd&navContentPaneEnabled=false&filterPaneEnabled=false",
        'REPORTE_INDUCCION': "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=6b02932cfdc934bbad76&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CARGA_TUTORIAL': "https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=92a9ea4e356075d5089e&navContentPaneEnabled=false&filterPaneEnabled=false",
        'RESUMEN_SEMAFORO': "https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=13a801ce8ba0312ed355&navContentPaneEnabled=false&filterPaneEnabled=false",
        'CALENDARIOS': "https://app.powerbi.com/rdlEmbed?reportId=94fc6064-322a-48be-9968-27fe00ee8ae0&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'CURSOS_INICIAR': "https://app.powerbi.com/rdlEmbed?reportId=2d95ad06-3811-4fba-a187-7e1e8f2ea61c&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'REPORTE_NRC': "https://app.powerbi.com/rdlEmbed?reportId=a0026236-1552-4a2d-bdc8-ee487be7de93&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'INCIDENCIAS_MASTER': "https://app.powerbi.com/rdlEmbed?reportId=42ddd2bd-2af5-4354-9c11-4f9f20c0805c&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'INCIDENCIAS_NRC': "https://app.powerbi.com/rdlEmbed?reportId=eda17000-5679-49f5-bc46-41cfff1bcb95&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi",
        'BASE_SEGUIMIENTO': "https://app.powerbi.com/rdlEmbed?reportId=72cf6f52-dfa3-4cba-92f4-6a8c5c8ccf8e&autoAuth=true&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&experience=power-bi"
    };

    const titulosVista = {
        'DASHBOARD_MACRO': 'Dashboard Macro Facultades',
        'REPORTE_INDUCCION': 'Reporte Inducción',
        'CARGA_TUTORIAL': 'Carga Tutorial',
        'RESUMEN_SEMAFORO': 'Resumen Semáforo',
        'CALENDARIOS': 'Calendarios',
        'CURSOS_INICIAR': 'Cursos Por Iniciar',
        'REPORTE_NRC': 'Reporte por NRC',
        'INCIDENCIAS_MASTER': 'Incidencias por Master',
        'INCIDENCIAS_NRC': 'Incidencias por NRC',
        'BASE_SEGUIMIENTO': 'Estado Base Seguimiento'
    };

    function cargar(clave, btn) {
        const url = misReportes[clave];
        if (url) document.getElementById('visor').src = url;
        document.querySelectorAll('button.menu-btn, a.menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('titulo-vista').textContent = titulosVista[clave] || 'Vista de Reporte';
        if (window.innerWidth < 800) toggleSidebar();
    }

    window.onload = function() {
        const btnInicio = document.querySelector('.menu-btn.active');
        if (btnInicio) cargar('DASHBOARD_MACRO', btnInicio);
    };
</script>
</body>
</html>
