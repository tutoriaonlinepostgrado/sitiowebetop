<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Coordinación - ETOP</title>
    <style>
        :root {
            --azul-fondo: #141b2d;
            --azul-sidebar: #1f2940;
            --amarillo-top: #ffd700;
            --texto-blanco: #ffffff;
            --texto-gris: #a3a3a3;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: var(--azul-fondo); }
        .app-container { display: flex; height: 100vh; width: 100vw; transition: all 0.3s ease; }
        .sidebar { width: 300px; background-color: var(--azul-sidebar); color: var(--texto-blanco); display: flex; flex-direction: column; border-right: 1px solid rgba(255, 215, 0, 0.1); z-index: 10; transition: margin-left 0.3s ease; flex-shrink: 0; overflow: hidden; }
        .sidebar.closed { margin-left: -300px; }
        .sidebar-header { padding: 25px 20px; border-bottom: 2px solid var(--amarillo-top); background-color: rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .sidebar-header h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--amarillo-top); text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-header span { font-size: 12px; color: var(--texto-gris); display: block; margin-top: 5px; }
        .sidebar-menu { flex-grow: 1; overflow-y: auto; padding-bottom: 15px; }
        .sidebar-menu::-webkit-scrollbar { width: 5px; }
        .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 10px; }
        .sidebar-menu::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.6); }
        .menu-category { padding: 15px 20px 5px 20px; font-size: 11px; text-transform: uppercase; color: var(--texto-gris); font-weight: 700; letter-spacing: 1px; }
        .menu-btn { background: none; border: none; color: #e0e0e0; padding: 12px 20px; text-align: left; font-size: 14px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px; width: 100%; text-decoration: none; box-sizing: border-box; }
        .menu-btn:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .menu-btn.active { background-color: rgba(255, 215, 0, 0.15); color: var(--amarillo-top); border-left: 4px solid var(--amarillo-top); font-weight: 600; }
        .btn-volver { margin-top: auto; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); color: var(--texto-gris); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.3s; flex-shrink: 0; background-color: var(--azul-sidebar); }
        .btn-volver:hover { color: var(--amarillo-top); background-color: rgba(0,0,0,0.2); }
        .collapsible-header { padding: 13px 20px; font-size: 14px; color: #e0e0e0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid transparent; transition: all 0.2s; user-select: none; }
        .collapsible-header:hover { background-color: rgba(255, 215, 0, 0.1); color: var(--amarillo-top); }
        .collapsible-header .header-left { display: flex; align-items: center; gap: 10px; }
        .collapsible-header .arrow { font-size: 10px; color: var(--texto-gris); transition: transform 0.25s ease; flex-shrink: 0; }
        .collapsible-header.open .arrow { transform: rotate(180deg); color: var(--amarillo-top); }
        .collapsible-header.open { color: var(--amarillo-top); background-color: rgba(255, 215, 0, 0.06); border-left: 4px solid rgba(255,215,0,0.3); }
        .collapsible-body { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
        .collapsible-body.open { max-height: 500px; }
        .collapsible-body .menu-btn { padding-left: 36px; font-size: 13px; color: #c0c0c0; border-left: 4px solid transparent; }
        .collapsible-body .menu-btn::before { content: '›'; color: rgba(255,215,0,0.4); font-size: 16px; margin-right: -4px; }
        .collapsible-body .menu-btn:hover { color: var(--amarillo-top); }
        .collapsible-body .menu-btn.active { color: var(--amarillo-top); border-left-color: var(--amarillo-top); }
        .content-area { flex-grow: 1; background-color: #F3F2F1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background-color: var(--azul-sidebar); min-height: 50px; display: flex; align-items: center; padding: 6px 12px 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
        .toggle-btn { background: none; border: none; color: var(--amarillo-top); font-size: 24px; cursor: pointer; padding: 5px 10px; border-radius: 5px; transition: 0.2s; flex-shrink: 0; }
        .toggle-btn:hover { background-color: rgba(255,255,255,0.1); }
        .titulo-vista { font-size: 13px; font-weight: 600; color: white; flex-shrink: 0; margin-right: 4px; white-space: nowrap; }
        .separator-bar { width: 1px; height: 24px; background: rgba(255,255,255,0.2); flex-shrink: 0; }

        /* ── FILTROS ── */
        .filtros-wrapper { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; flex: 1; }
        .filtro-select {
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 20px;
            color: #e0e0e0;
            font-size: 12px;
            padding: 4px 10px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            max-width: 155px;
            min-width: 90px;
        }
        .filtro-select:hover, .filtro-select:focus { border-color: rgba(255,215,0,0.7); background-color: rgba(255,255,255,0.13); color: #fff; }
        .filtro-select option { background-color: #1f2940; color: #e0e0e0; }
        .filtro-select:disabled { opacity: 0.4; cursor: not-allowed; }
        .multi-filtro { position: relative; flex-shrink: 0; }
        .multi-filtro.oculto, .oculto { display: none !important; }
        .multi-btn { max-width: 175px; min-width: 105px; height: 28px; display:flex; align-items:center; justify-content:space-between; gap:8px; white-space:nowrap; overflow:hidden; }
        .multi-btn span { overflow:hidden; text-overflow:ellipsis; }
        .multi-panel { position:absolute; top:calc(100% + 5px); left:0; z-index:10000; display:none; width:270px; max-height:330px; padding:8px; background:#1a2540; border:1px solid rgba(255,215,0,.38); border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.48); }
        .multi-filtro.abierto .multi-panel { display:block; }
        .multi-search { width:100%; box-sizing:border-box; margin-bottom:7px; padding:7px 9px; border:1px solid rgba(255,255,255,.18); border-radius:7px; background:#111a2e; color:#fff; outline:none; }
        .multi-search:focus { border-color:rgba(255,215,0,.7); }
        .multi-date-picker { width:100%; box-sizing:border-box; margin-bottom:8px; padding:7px 9px; border:1px solid rgba(255,215,0,.42); border-radius:7px; background:#111a2e; color:#fff; color-scheme:dark; outline:none; }
        .multi-date-help { color:#aebbd3; font-size:10px; margin:-2px 2px 7px; }
        .multi-opciones { max-height:245px; overflow:auto; }
        .multi-opcion { display:flex; align-items:flex-start; gap:8px; padding:7px 6px; color:#e5e7eb; font-size:12px; border-radius:6px; cursor:pointer; }
        .multi-opcion:hover { background:rgba(255,215,0,.12); }
        .multi-opcion input { margin-top:2px; accent-color:#ffd700; }
        .multi-vacio { padding:10px 6px; color:#a3a3a3; font-size:12px; }
        .date-filter-wrap { display:flex; align-items:center; gap:6px; height:28px; padding:0 8px; border:1px solid rgba(255,215,0,.42); border-radius:20px; background:rgba(255,255,255,.1); color:#ffd700; flex-shrink:0; }
        .date-filter-label { font-size:11px; font-weight:700; white-space:nowrap; }
        .date-filter-input { width:118px; padding:0; border:0; border-radius:0; background:transparent; color:#fff; font-size:11px; color-scheme:dark; }
        .date-filter-input:focus { width:118px; border:0; background:transparent; box-shadow:none; }
        .date-filter-clear { border:0; background:transparent; color:#fca5a5; font-size:16px; line-height:1; cursor:pointer; padding:0 2px; }

        /* pill NRC */
        .pill-wrap { position: relative; display: flex; align-items: center; flex-shrink: 0; }
        .pill-input {
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 20px;
            color: #e0e0e0;
            font-size: 12px;
            padding: 4px 10px;
            outline: none;
            transition: all 0.2s;
            width: 90px;
        }
        .pill-input::placeholder { color: rgba(255,255,255,0.35); }
        .pill-input:focus { border-color: rgba(255,215,0,0.7); background-color: rgba(255,255,255,0.13); color: #fff; width: 140px; }
        .pill-input:disabled { opacity: 0.4; cursor: not-allowed; }
        /* dropdown custom NRC */
        .nrc-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            background: #1a2540;
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            min-width: 220px;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .nrc-dropdown.visible { display: block; }
        .nrc-dropdown-item {
            padding: 7px 12px;
            font-size: 12px;
            color: #d0d0d0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nrc-dropdown-item:hover, .nrc-dropdown-item.selected { background: rgba(255,215,0,0.15); color: #fff; }
        .nrc-dropdown-item .match { color: var(--amarillo-top); font-weight: 700; }
        .nrc-dropdown::-webkit-scrollbar { width: 4px; }
        .nrc-dropdown::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 4px; }



        /* badge + limpiar */
        .badge-activo {
            background: rgba(255,215,0,0.18);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 20px;
            color: var(--amarillo-top);
            font-size: 11px;
            padding: 3px 9px;
            display: none;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .badge-activo.visible { display: flex; }
        .btn-limpiar {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 20px;
            color: #fca5a5;
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-limpiar:hover { background: rgba(239,68,68,0.3); border-color: rgba(239,68,68,0.7); }
        .btn-limpiar.visible { display: flex; }

        iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }
        .btn-tutoria {
            margin: 12px 15px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
            border: 1px solid rgba(34,197,94,0.4);
            border-radius: 8px;
            color: #4ade80;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-tutoria:hover { background: linear-gradient(135deg, rgba(34,197,94,0.25), rgba(34,197,94,0.1)); border-color: #22c55e; }
    </style>
</head>

                        oninput="onNRCInput(this.value)"

<script>
    /* ========================================================
       MAPA DE REPORTES
       Solo los reportes Power BI (powerbi.com/reportEmbed)
       reciben filtros OData. Los RDL y las páginas HTML locales
       se cargan sin parámetro &filter=
    ======================================================== */
    const misReportes = {
        'BASE_COORDINACION': {
            url: "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=9740492cd2050949826e&navContentPaneEnabled=false&filterPaneEnabled=false",
            tipo: 'pbi'
        },
        'DASHBOARD_MACRO': {
            url: "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=7a41932f4078dbccf8cd&navContentPaneEnabled=false&filterPaneEnabled=false",
            tipo: 'pbi'
        },
        'REPORTE_INDUCCION': {
            url: "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=6b02932cfdc934bbad76&navContentPaneEnabled=false&filterPaneEnabled=false",
            tipo: 'pbi'
        },
        'CARGA_TUTORIAL': {
            url: "https://app.powerbi.com/reportEmbed?reportId=f32734ec-3c94-43fa-a8fb-8d8eebbcf11a&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=92a9ea4e356075d5089e&navContentPaneEnabled=false&filterPaneEnabled=false",
            tipo: 'pbi'
        },
        'CALENDARIOS': {
            url: "https://tutoriaonlinepostgrado.github.io/sitiowebetop/calendarios.html?v=20260820-multifechaexcel1",
            tipo: 'local'
        },
      'CURSOS_INICIAR': {
    url: "https://app.powerbi.com/reportEmbed?reportId=66b1fc8c-00c8-44f3-b327-890f57f3c7b8&groupId=308deb6f-aa2f-4c21-b5fb-33b977c17e13&ctid=8fbed393-d03b-49f8-be79-cd5e1f590fb2&autoAuth=true&pageName=60127766361783cd5242&navContentPaneEnabled=false&filterPaneEnabled=false",
    tipo: 'pbi'
},
        'INCIDENCIAS': {
            url: "incidencias.html",
            tipo: 'local'
        }
    };

    const titulosVista = {
        'BASE_COORDINACION': 'Base Madre Coordinación',
        'DASHBOARD_MACRO': 'Dashboard Macro Facultades',
        'REPORTE_INDUCCION': 'Reporte Inducción',
        'CARGA_TUTORIAL': 'Carga Tutorial',
        'CALENDARIOS': 'Calendarios',
        'CURSOS_INICIAR': 'Cursos por iniciar',
        'INCIDENCIAS': 'Incidencias'
    };

    // Tutores activos: controla únicamente las opciones del desplegable.
    // No elimina ni oculta cursos históricos del catálogo o de Power BI.
    const TUTORES_ACTIVOS = new Set(["HANS NOVAKOVIC","KIMBERLY JORQUERA","MARTA GONZALEZ","DANITZA JANSEN","SYLVIA VALENZUELA","PAULA PARDO","MARIA FERNANDA GONZALEZ","BARBARA ROJAS","CONSTANZA CONTRERAS","CARLA PENA","NOEMI PAZ","ORIETTA CORTES","HECTOR TAPIA","CONSUELO PARGA","FRANCISCA INDA","JAVIERA ROJAS","ALYSON HERNANDEZ"]);
    function claveTutorActivo(valor) {
        return String(valor || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ').trim().toUpperCase();
    }
    function esTutorActivo(valor) {
        return TUTORES_ACTIVOS.has(claveTutorActivo(valor));
    }

    /* ── estado global ── */
    let nrcsData = [];
    let claveActual = 'DASHBOARD_MACRO';
    let nrcConfirmado = '';   // NRC seleccionado que se envía al iframe (distinto del texto parcial del input)
    const CAMPOS_MULTI = ['facultad','tutor','tipo','estado','intake','fechaInicio'];
    const ETIQUETAS_MULTI = { facultad:'Facultad', tutor:'Tutor', tipo:'Tipo', estado:'Estado', intake:'Intake o versión', fechaInicio:'Fecha de inicio' };
    const seleccionMulti = Object.fromEntries(CAMPOS_MULTI.map(c => [c, new Set()]));

    const NRCS_JSON_URL = 'https://tutoriaonlinepostgrado.github.io/sitiowebetop/nrcs.json';

    /* ========================================================
       CARGA DE nrcs.json
    ======================================================== */
    async function cargarNRCS() {
        try {
            const r = await fetch(NRCS_JSON_URL, { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            nrcsData = await r.json();
            poblarFiltros();
            habilitarControles();
        } catch (e) {
            console.warn('nrcs.json no disponible:', e.message);
            // deja controles deshabilitados con texto de error
            CAMPOS_MULTI.forEach(c => document.getElementById('mf-' + c).innerHTML = '<button class="filtro-select multi-btn" disabled>⚠️ Sin datos</button>');
            document.getElementById('pill-nrc').placeholder = '⚠️ Sin datos';
        }
    }

    function habilitarControles() {
        document.getElementById('pill-nrc').disabled = false;
    }

    /* ========================================================
       POBLAR SELECTS desde array de NRCs
    ======================================================== */
    function valoresCampo(campo) {
        const subset = nrcsFiltrados(campo);
        return [...new Set(subset.map(x => campo === 'fechaInicio' ? fechaISO(x['fecha inicio']) : x[campo]).filter(Boolean).filter(v => campo !== 'tutor' || esTutorActivo(v)))].sort((a,b) => a.localeCompare(b,'es'));
    }

    function poblarFiltros() {
        CAMPOS_MULTI.forEach(renderMulti);
        llenarDatalist([...new Set(nrcsData.map(x => x.nrc).filter(Boolean))].sort());
    }

    function renderMulti(campo) {
        const host = document.getElementById('mf-' + campo);
        const abierto = host.classList.contains('abierto');
        const busqueda = host.querySelector('.multi-search')?.value || '';
        const valores = valoresCampo(campo);
        const elegidos = seleccionMulti[campo];
        [...elegidos].forEach(v => { if (!valores.includes(v)) elegidos.delete(v); });
        const n = elegidos.size;
        const mostrarValor=v=>campo==='fechaInicio'?v.split('-').reverse().join('-'):v;
        const texto = n === 0 ? ETIQUETAS_MULTI[campo] : n === 1 ? mostrarValor([...elegidos][0]) : `${ETIQUETAS_MULTI[campo]} (${n})`;
        if (campo === 'fechaInicio') {
            const resumen = n ? (n === 1 ? mostrarValor([...elegidos][0]) : n + ' fechas') : 'Fecha de inicio';
            host.innerHTML = `<div class="date-filter-wrap" title="${escHtml([...elegidos].map(mostrarValor).join(', '))}">
                <span class="date-filter-label">📅 ${escHtml(resumen)}</span>
                <input type="date" class="date-filter-input" aria-label="Agregar fecha de inicio" onchange="agregarFechaInicio(this.value)">
                ${n ? '<button type="button" class="date-filter-clear" title="Quitar fechas" onclick="limpiarFechasInicio(event)">×</button>' : ''}
            </div>`;
            return;
        }
        const buscable = campo === 'tutor' || campo === 'intake';
        host.innerHTML = `<button type="button" class="filtro-select multi-btn" onclick="toggleMulti('${campo}',event)" title="${escHtml(texto)}"><span>${escHtml(texto)}</span><b>⌄</b></button>
          <div class="multi-panel">${buscable ? `<input class="multi-search" value="${escHtml(busqueda)}" placeholder="Buscar ${ETIQUETAS_MULTI[campo].toLowerCase()}..." oninput="filtrarOpcionesMulti('${campo}',this.value)">` : ''}
          <div class="multi-opciones">${valores.length ? valores.map(v => `<label class="multi-opcion" data-texto="${escHtml(v.toLowerCase())}"><input type="checkbox" ${elegidos.has(v)?'checked':''} onchange="cambiarMulti('${campo}','${encodeURIComponent(v).replace(/'/g,'%27')}',this.checked)"><span>${escHtml(mostrarValor(v))}</span></label>`).join('') : '<div class="multi-vacio">Sin opciones disponibles</div>'}</div></div>`;
        if (abierto) host.classList.add('abierto');
        if (busqueda) filtrarOpcionesMulti(campo,busqueda);
    }

    function toggleMulti(campo, e) {
        e.stopPropagation();
        const host = document.getElementById('mf-' + campo);
        const abrir = !host.classList.contains('abierto');
        document.querySelectorAll('.multi-filtro').forEach(x => x.classList.remove('abierto'));
        if (abrir) { host.classList.add('abierto'); setTimeout(() => host.querySelector('.multi-search')?.focus(),0); }
    }

    function filtrarOpcionesMulti(campo, texto) {
        const q = texto.trim().toLowerCase();
        document.querySelectorAll(`#mf-${campo} .multi-opcion`).forEach(x => x.style.display = x.dataset.texto.includes(q) ? '' : 'none');
    }

    function cambiarMulti(campo, valorCodificado, marcado) {
        const valor = decodeURIComponent(valorCodificado);
        marcado ? seleccionMulti[campo].add(valor) : seleccionMulti[campo].delete(valor);
        sincronizarFiltros(campo);
    }

    function agregarFechaInicio(valor) {
        const fecha = fechaISO(valor);
        if (!fecha) return;
        seleccionMulti.fechaInicio.add(fecha);
        sincronizarFiltros('fechaInicio');
    }

    function limpiarFechasInicio(evento) {
        if (evento) evento.stopPropagation();
        seleccionMulti.fechaInicio.clear();
        sincronizarFiltros('fechaInicio');
    }


    /* NRC dropdown custom */
    let nrcListaCompleta = [];
    let nrcDropdownIdx = -1;

    function llenarDatalist(nrcs) {
        // guarda la lista; el dropdown se construye al escribir
        nrcListaCompleta = nrcs;
    }

    function onNRCInput(val) {
        nrcDropdownIdx = -1;
        const q = val.trim().toUpperCase();
        // Si el usuario edita el campo → anular la confirmación previa
        if (val.trim() !== nrcConfirmado) nrcConfirmado = '';
        if (!q) {
            ocultarDropdownNRC();
            sincronizarFiltros('nrc');   // refresca iframe sin NRC
            return;
        }
        // Busca SIEMPRE en nrcsData completo — no en el subconjunto filtrado
        // para que el usuario pueda encontrar cualquier NRC independientemente
        // de los otros filtros activos.
        const todosLosNRCs = [...new Set(nrcsData.map(x => x.nrc).filter(Boolean))].sort();
        const matches = todosLosNRCs.filter(n => n.toUpperCase().includes(q)).slice(0, 50);
        renderDropdownNRC(matches, q);
    }

    function onNRCKeydown(e) {
        const dd = document.getElementById('nrc-dropdown');
        const items = dd.querySelectorAll('.nrc-dropdown-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            nrcDropdownIdx = Math.min(nrcDropdownIdx + 1, items.length - 1);
            actualizarSeleccionDropdown(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            nrcDropdownIdx = Math.max(nrcDropdownIdx - 1, -1);
            actualizarSeleccionDropdown(items);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (nrcDropdownIdx >= 0 && items[nrcDropdownIdx]) {
                seleccionarNRC(items[nrcDropdownIdx].dataset.val);
            } else {
                seleccionarNRC(document.getElementById('pill-nrc').value.trim());
            }
        } else if (e.key === 'Escape') {
            ocultarDropdownNRC();
        }
    }

    function actualizarSeleccionDropdown(items) {
        items.forEach((el, i) => el.classList.toggle('selected', i === nrcDropdownIdx));
        if (nrcDropdownIdx >= 0 && items[nrcDropdownIdx]) items[nrcDropdownIdx].scrollIntoView({ block: 'nearest' });
    }

    function renderDropdownNRC(matches, q) {
        const dd = document.getElementById('nrc-dropdown');
        if (!matches.length) { ocultarDropdownNRC(); return; }
        dd.innerHTML = '';
        matches.forEach(n => {
            const div = document.createElement('div');
            div.className = 'nrc-dropdown-item';
            div.dataset.val = n;
            // resalta la parte que coincide
            const idx = n.toUpperCase().indexOf(q);
            if (idx >= 0) {
                div.innerHTML = escHtml(n.slice(0, idx))
                    + `<span class="match">${escHtml(n.slice(idx, idx + q.length))}</span>`
                    + escHtml(n.slice(idx + q.length));
            } else {
                div.textContent = n;
            }
            div.addEventListener('mousedown', () => seleccionarNRC(n));
            dd.appendChild(div);
        });
        dd.classList.add('visible');
    }

    function seleccionarNRC(val) {
        // Solo confirmar si el valor existe exactamente en la lista
        const existe = nrcsData.some(x => x.nrc === val);
        nrcConfirmado = existe ? val : '';
        document.getElementById('pill-nrc').value = val;
        ocultarDropdownNRC();
        sincronizarFiltros('nrc');
    }

    function mostrarDropdownNRC() {
        const q = document.getElementById('pill-nrc').value.trim().toUpperCase();
        if (q) onNRCInput(document.getElementById('pill-nrc').value);
    }

    function ocultarDropdownNRC() {
        document.getElementById('nrc-dropdown').classList.remove('visible');
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ========================================================
       CROSS-FILTER INTERDEPENDIENTE
       Al cambiar cualquier filtro se recalcula el subconjunto
       de NRCs válidos para los demás filtros.
    ======================================================== */
    function getFiltrosActivos() {
        return {
            facultad : [...seleccionMulti.facultad],
            tutor    : [...seleccionMulti.tutor],
            tipo     : [...seleccionMulti.tipo],
            estado   : [...seleccionMulti.estado],
            intake   : [...seleccionMulti.intake],
            fechaInicio : [...seleccionMulti.fechaInicio],
            nrc      : nrcConfirmado   // solo NRC confirmado (click/Enter), nunca texto parcial
        };
    }

    function nrcsFiltrados(excluir = null) {
        const f = getFiltrosActivos();
        // Para el cross-filter de los dropdowns usamos el NRC confirmado (coincidencia exacta).
        // El texto parcial del input NO restringe los demás selects.
        return nrcsData.filter(x => {
            if (excluir !== 'facultad' && f.facultad.length && !f.facultad.includes(x.facultad)) return false;
            if (excluir !== 'tutor'    && f.tutor.length    && !f.tutor.includes(x.tutor)) return false;
            if (excluir !== 'tipo'     && f.tipo.length     && !f.tipo.includes(x.tipo)) return false;
            if (excluir !== 'estado'   && f.estado.length   && !f.estado.includes(x.estado)) return false;
            if (excluir !== 'intake'   && f.intake.length   && !f.intake.includes(x.intake)) return false;
            if (excluir !== 'fechaInicio' && f.fechaInicio.length && !f.fechaInicio.includes(fechaISO(x['fecha inicio']))) return false;
            if (excluir !== 'nrc'      && f.nrc      && x.nrc !== f.nrc)                      return false;
            return true;
        });
    }

    function sincronizarFiltros(cambiado) {
        CAMPOS_MULTI.forEach(renderMulti);

        // actualizar lista de NRCs disponibles según subconjunto activo
        const nrcsActivos = [...new Set(nrcsFiltrados(null).map(x => x.nrc).filter(Boolean))].sort();
        nrcListaCompleta = nrcsActivos;

        actualizarBadge();
        refrescarIframe();
    }

    // cierra dropdown al hacer click fuera
    document.addEventListener('click', e => {
        if (!document.getElementById('nrc-wrap').contains(e.target)) ocultarDropdownNRC();
        if (!e.target.closest('.multi-filtro')) document.querySelectorAll('.multi-filtro').forEach(x => x.classList.remove('abierto'));
    });

    /* ========================================================
       CONSTRUCCIÓN DE URL OData
       Tabla semántica: NRC_TUTOR_ACTUAL
       Solo para reportes tipo 'pbi'. RDL y páginas locales quedan sin filtro.
    ======================================================== */
    function sanitizar(v) {
        // Escapa comillas simples dentro del valor OData
        return v.replace(/'/g, "''");
    }
    function fechaISO(v) {
        const m=String(v||'').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
        const d=String(v||'').trim().match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        return d ? `${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}` : '';
    }
    function condicionMultiple(columna, valores) {
        const limpios = valores.map(v => `'${sanitizar(v)}'`);
        if (limpios.length === 1) return `${columna} eq ${limpios[0]}`;
        return `${columna} in (${limpios.join(',')})`;
    }

    function buildURLFiltrada() {
        const cfg = misReportes[claveActual];
        if (!cfg) return '';

        const f = getFiltrosActivos();

        // Las páginas HTML locales reciben sus filtros como parámetros URL.
        if (cfg.tipo === 'local') {
            const urlLocal = new URL(cfg.url, window.location.href);
            if (claveActual === 'CALENDARIOS') {
                if (f.facultad.length) urlLocal.searchParams.set('facultad', f.facultad.join('|'));
                if (f.tutor.length)    urlLocal.searchParams.set('tutor', f.tutor.join('|'));
                if (f.tipo.length)     urlLocal.searchParams.set('tipo', f.tipo.join('|'));
                if (f.estado.length)   urlLocal.searchParams.set('estado', f.estado.join('|'));
                if (f.intake.length)   urlLocal.searchParams.set('intake', f.intake.join('|'));
                if (f.fechaInicio.length) urlLocal.searchParams.set('fechaInicio', f.fechaInicio.join('|'));
                if (f.nrc)      urlLocal.searchParams.set('nrc', f.nrc);
            }
            return urlLocal.toString();
        }

        if (cfg.tipo !== 'pbi') return cfg.url;

        const condiciones = [];

        // Estos son los nombres EXACTOS del modelo semántico de Power BI.
        // Los nombres internos de SharePoint no se utilizan en esta URL.
        if (f.facultad.length) condiciones.push(condicionMultiple('NRC_TUTOR_ACTUAL/FACULTAD', f.facultad));
        if (f.tutor.length)    condiciones.push(condicionMultiple('NRC_TUTOR_ACTUAL/NOMBRE_TUTOR', f.tutor));
        if (f.tipo.length)     condiciones.push(condicionMultiple('NRC_TUTOR_ACTUAL/TIPO_NRC', f.tipo));
        if (f.estado.length)   condiciones.push(condicionMultiple('NRC_TUTOR_ACTUAL/ESTADO_CAL', f.estado));
        if (f.fechaInicio.length) {
            const fechasValidas = f.fechaInicio.map(fechaISO).filter(Boolean);
            if (fechasValidas.length === 1) condiciones.push(`NRC_TUTOR_ACTUAL/Fecha_inicios_NRC eq '${fechasValidas[0].split('-').reverse().join('-')}'`);
            if (fechasValidas.length > 1) condiciones.push(`(${fechasValidas.map(v => `NRC_TUTOR_ACTUAL/Fecha_inicios_NRC eq '${v.split('-').reverse().join('-')}'`).join(' or ')})`);
        }
        if (f.nrc)      condiciones.push(`NRC_TUTOR_ACTUAL/NRC_COD_CAL eq '${sanitizar(f.nrc)}'`);

        if (condiciones.length === 0) return cfg.url;

        const filtro = condiciones.join(' and ');

        // URLSearchParams codifica correctamente el filtro sin dañar la URL
        // base del reporte. Los segmentadores nativos de Power BI siguen activos.
        const url = new URL(cfg.url);
        // Sintaxis oficial de filtros URL de Power BI: filter=Tabla/Campo eq 'valor'.
        url.searchParams.set('filter', filtro);
        return url.toString();
    }

    /* ========================================================
       BADGE DE FILTROS ACTIVOS
    ======================================================== */
    function actualizarBadge() {
        const f = getFiltrosActivos();
        const partes = [];
        CAMPOS_MULTI.forEach(c => { if (f[c].length) partes.push(f[c].length === 1 ? (c==='fechaInicio' ? f[c][0].split('-').reverse().join('-') : f[c][0]) : `${ETIQUETAS_MULTI[c]} (${f[c].length})`); });
        if (f.nrc)      partes.push('NRC: ' + f.nrc);

        const badge   = document.getElementById('badge-activo');
        const limpiar = document.getElementById('btn-limpiar');
        const txt     = document.getElementById('badge-txt');

        if (partes.length > 0) {
            txt.textContent = partes.join(' › ');
            badge.classList.add('visible');
            limpiar.classList.add('visible');
        } else {
            badge.classList.remove('visible');
            limpiar.classList.remove('visible');
        }
    }

    /* ========================================================
       LIMPIAR TODO
    ======================================================== */
    function limpiarTodo() {
        CAMPOS_MULTI.forEach(c => seleccionMulti[c].clear());
        document.getElementById('pill-nrc').value = '';
        nrcConfirmado = '';
        ocultarDropdownNRC();
        poblarFiltros();
        actualizarBadge();
        refrescarIframe();
    }

    /* ========================================================
       CARGA DE REPORTE EN IFRAME
    ======================================================== */
    function refrescarIframe() {
        const url = buildURLFiltrada();
        if (url) document.getElementById('visor').src = url;
    }

    function cargar(clave, btn) {
        claveActual = clave;
        document.getElementById('mf-intake').classList.toggle('oculto', clave !== 'CALENDARIOS');
        document.getElementById('mf-fechaInicio').classList.toggle('oculto', !['CALENDARIOS','CURSOS_INICIAR'].includes(clave));
        refrescarIframe();
        document.querySelectorAll('button.menu-btn, a.menu-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.getElementById('titulo-vista').textContent = titulosVista[clave] || 'Vista de Reporte';
        if (window.innerWidth < 800) toggleSidebar();
    }

    /* ========================================================
       SIDEBAR
    ======================================================== */
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }

    function toggleCollapsible(nombre) {
        document.getElementById('header-' + nombre).classList.toggle('open');
        document.getElementById('body-' + nombre).classList.toggle('open');
    }

    /* ========================================================
       INIT
    ======================================================== */
    window.onload = function() {
        cargarNRCS();
        const btnInicio = document.querySelector('.menu-btn.active');
        if (btnInicio) cargar('DASHBOARD_MACRO', btnInicio);
    };
</script>
