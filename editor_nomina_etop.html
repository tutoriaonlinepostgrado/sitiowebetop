<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Nómina — ETOP</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #19202e;
  --dark2: #242d3f;
  --dark3: #2e3a50;
  --gold: #facc15;
  --gold2: #f59e0b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --purple: #a855f7;
  --orange: #f97316;
  --blue: #3b82f6;
  --border: rgba(255,255,255,0.08);
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--dark);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--dark2);
  border-bottom: 3px solid var(--gold);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header img { height: 44px; width: auto; }
.header-title { font-size: 16px; font-weight: 700; color: #fff; }
.header-sub { font-size: 10px; color: var(--gold); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

/* MAIN */
#appPanel { padding: 20px 24px; }

/* BUSCADOR */
.search-bar {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.field-input {
  background: var(--dark3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  min-width: 180px;
  transition: border-color .2s;
}
.field-input:focus { outline: none; border-color: var(--gold); }
.btn-buscar {
  background: var(--gold);
  color: var(--dark);
  border: none;
  padding: 9px 20px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.btn-buscar:hover { background: var(--gold2); }
.btn-buscar:disabled { opacity: .5; cursor: not-allowed; }

/* STATS */
.stats-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.stat {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 90px;
}
.stat-val { font-size: 20px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
.stat-lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
.s-total .stat-val { color: var(--blue); }
.s-verde .stat-val { color: var(--green); }
.s-rojo .stat-val { color: var(--red); }
.s-amarillo .stat-val { color: var(--yellow); }
.s-morado .stat-val { color: var(--purple); }
.s-noing .stat-val { color: var(--red); }

/* TOOLBAR */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-save-all {
  background: var(--green);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
}
.btn-save-all:hover { background: #16a34a; }
.btn-save-all:disabled { opacity: .5; cursor: not-allowed; }
.changes-badge {
  background: var(--gold);
  color: var(--dark);
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 100px;
  display: none;
}
.search-inline {
  background: var(--dark3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 12px;
  font-family: inherit;
  font-size: 12px;
  width: 220px;
}
.search-inline:focus { outline: none; border-color: var(--gold); }

/* TABLE */
.table-wrap {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; max-height: calc(100vh - 300px); overflow-y: auto; }
table { width: 100%; border-collapse: collapse; min-width: 1100px; }
thead { position: sticky; top: 0; z-index: 10; }
th {
  background: var(--dark);
  color: var(--gold);
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 2px solid var(--gold);
}
td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 12px;
}
tr:hover td { background: rgba(255,255,255,0.02); }
tr.modified td { background: rgba(250,204,21,0.04); }
tr.saving td { opacity: .6; }
tr.saved-ok td { background: rgba(34,197,94,0.08); }

.cell-rut { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
.cell-nombre { font-weight: 600; color: #fff; min-width: 180px; }

.cell-select {
  background: var(--dark3);
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--text);
  padding: 4px 6px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  width: 100%;
  transition: border-color .15s;
}
.cell-select:focus { outline: none; border-color: var(--gold); }
.cell-select.changed { border-color: var(--gold); background: rgba(250,204,21,0.1); }

.cell-obs {
  background: var(--dark3);
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--text);
  padding: 4px 6px;
  font-family: inherit;
  font-size: 11px;
  width: 100%;
  resize: none;
  min-height: 32px;
  line-height: 1.4;
  transition: border-color .15s;
}
.cell-obs:focus { outline: none; border-color: var(--gold); }
.cell-obs.changed { border-color: var(--gold); background: rgba(250,204,21,0.1); }

.btn-fila {
  background: var(--dark3);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
  font-family: inherit;
  transition: all .2s;
  white-space: nowrap;
}
.btn-fila:hover { border-color: var(--green); color: var(--green); }

.status-bar {
  padding: 8px 12px;
  font-size: 11px;
  border-top: 1px solid var(--border);
  min-height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-ok { color: var(--green); }
.status-err { color: var(--red); }
.status-loading { color: var(--gold); }

.spinner {
  width: 12px; height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}
.empty-state .big { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="header">
  <img src="https://res.cloudinary.com/dk53pztfo/image/upload/v1760373349/ETOP_1__03_e5xcw0.png" alt="ETOP">
  <div>
    <div class="header-title">Editor de Nómina</div>
    <div class="header-sub">Portal de Gestión Tutorial · ETOP</div>
  </div>
</div>

<div id="appPanel">
  <div class="search-bar">
    <div class="field-group">
      <div class="field-label">NRC Código</div>
      <input type="text" class="field-input" id="inputNRC" placeholder="ej: 2201_UNI118">
    </div>
    <div class="field-group">
      <div class="field-label">Periodo</div>
      <input type="text" class="field-input" id="inputPeriodo" placeholder="ej: 202681" style="min-width:130px">
    </div>
    <button class="btn-buscar" id="btnBuscar" onclick="buscar()">🔍 Buscar estudiantes</button>
  </div>

  <div id="statsBar" class="stats-bar" style="display:none">
    <div class="stat s-total"><div class="stat-val" id="stTotal">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat s-verde"><div class="stat-val" id="stVerde">0</div><div class="stat-lbl">🟢 Verde</div></div>
    <div class="stat s-amarillo"><div class="stat-val" id="stAmarillo">0</div><div class="stat-lbl">🟡 Amarillo</div></div>
    <div class="stat s-rojo"><div class="stat-val" id="stRojo">0</div><div class="stat-lbl">🔴 Rojo</div></div>
    <div class="stat s-morado"><div class="stat-val" id="stMorado">0</div><div class="stat-lbl">🟣 Morado</div></div>
    <div class="stat s-noing"><div class="stat-val" id="stNoIng">0</div><div class="stat-lbl">✗ No Ingresó</div></div>
  </div>

  <div id="tableSection" style="display:none">
    <div class="toolbar">
      <button class="btn-save-all" id="btnSaveAll" onclick="guardarTodos()" disabled>💾 Guardar todos los cambios</button>
      <span class="changes-badge" id="changesBadge"></span>
      <input type="text" class="search-inline" id="searchInline" placeholder="🔍 Filtrar por nombre o RUT..." oninput="filtrarTabla()">
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>RUT</th>
              <th>Nombre</th>
              <th>Semáforo</th>
              <th>Estado Est.</th>
              <th>Banner</th>
              <th>Canvas</th>
              <th>Ingresa Curso</th>
              <th style="min-width:240px">Observaciones</th>
              <th>Guardar</th>
            </tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
      <div class="status-bar" id="statusBar"><span class="status-ok">✓ Listo</span></div>
    </div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none">
    <div class="big">📋</div>
    <p>No se encontraron estudiantes para ese NRC y periodo.</p>
  </div>
</div>

<script>
const FLOW_LEER = 'https://default8fbed393d03b49f8be79cd5e1f590f.b2.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4a36ccd81fae415a81fa65952e8b737f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=v0j6Rr_6d-VXyELTV7IBX3kvm79lD-4WfUn4cGaBxDg';
const FLOW_ACTUALIZAR = 'https://default8fbed393d03b49f8be79cd5e1f590f.b2.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9cfe77e8e8e9410da2eac53fc990e5fe/triggers/manual/paths/invoke?api-version=1';

let allData = [];
let pendingChanges = {};

// ── BUSCAR ──────────────────────────────────────────────────
async function buscar() {
  const nrc = document.getElementById('inputNRC').value.trim();
  const periodo = document.getElementById('inputPeriodo').value.trim();
  if (!nrc || !periodo) { setStatus('⚠️ Completa NRC y Periodo', 'err'); return; }

  const btn = document.getElementById('btnBuscar');
  btn.disabled = true;
  btn.textContent = '⏳ Buscando...';
  setStatus('<span class="spinner"></span> Consultando SharePoint...', 'loading');

  try {
    const resp = await fetch(FLOW_LEER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nrc_cod: nrc, periodo: periodo })
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    allData = Array.isArray(data) ? data : (data.value || []);

    if (allData.length === 0) {
      document.getElementById('statsBar').style.display = 'none';
      document.getElementById('tableSection').style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
      setStatus('Sin resultados', 'err');
    } else {
      document.getElementById('emptyState').style.display = 'none';
      renderStats();
      renderTabla();
      document.getElementById('statsBar').style.display = 'flex';
      document.getElementById('tableSection').style.display = 'block';
      setStatus(`✓ ${allData.length} estudiantes cargados`, 'ok');
    }
  } catch(e) {
    setStatus(`✗ Error: ${e.message}`, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Buscar estudiantes';
  }
}

// ── RENDER TABLA ────────────────────────────────────────────
function renderTabla() {
  pendingChanges = {};
  updateBadge();
  const tbody = document.getElementById('tablaBody');
  tbody.innerHTML = allData.map((item, idx) => {
    const id = item.ID || item.Id;
    const rut = item.Title || '';
    const nombre = item.field_11 || '';
    const sem = item.SEMAFORO || 'VERDE';
    const est = item.field_15 || 'ACTIVO';
    const ban = item.field_17 || '';
    const can = item.field_18 || '';
    const ing = item.field_16 || '';
    const obs = (item.Observaciones || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    return `<tr id="row-${id}" data-id="${id}" data-nom="${nombre.toLowerCase()}" data-rut="${rut.toLowerCase()}">
      <td style="color:var(--muted);font-size:10px;font-family:'IBM Plex Mono',monospace">${idx+1}</td>
      <td class="cell-rut">${rut}</td>
      <td class="cell-nombre">${nombre}</td>
      <td><select class="cell-select" onchange="mark(${id},'SEMAFORO',this.value,this)">
        ${opts(['VERDE','AMARILLO','ROJO','MORADO','NARANJO'], sem)}
      </select></td>
      <td><select class="cell-select" onchange="mark(${id},'field_15',this.value,this)">
        ${opts(['ACTIVO','EN TRAMITE','RESCILIACION','RETIRO DEF','RETIR TEMP.','EGRESADO'], est)}
      </select></td>
      <td><select class="cell-select" onchange="mark(${id},'field_17',this.value,this)">
        ${opts(['SI','NO'], ban)}
      </select></td>
      <td><select class="cell-select" onchange="mark(${id},'field_18',this.value,this)">
        ${opts(['SI','NO'], can)}
      </select></td>
      <td><select class="cell-select" onchange="mark(${id},'field_16',this.value,this)">
        ${opts(['SI','NO',''], ing, {'':'Sin dato'})}
      </select></td>
      <td><textarea class="cell-obs" rows="1" oninput="autoH(this);mark(${id},'Observaciones',this.value,this)">${obs}</textarea></td>
      <td><button class="btn-fila" id="btn-${id}" onclick="guardarFila(${id})">💾 Guardar</button></td>
    </tr>`;
  }).join('');
}

function opts(arr, selected, labels={}) {
  return arr.map(v => `<option value="${v}" ${v===selected?'selected':''}>${labels[v]||v||'Sin dato'}</option>`).join('');
}

function autoH(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ── STATS ───────────────────────────────────────────────────
function renderStats() {
  document.getElementById('stTotal').textContent = allData.length;
  document.getElementById('stVerde').textContent   = allData.filter(d=>d.SEMAFORO==='VERDE').length;
  document.getElementById('stAmarillo').textContent= allData.filter(d=>d.SEMAFORO==='AMARILLO').length;
  document.getElementById('stRojo').textContent    = allData.filter(d=>d.SEMAFORO==='ROJO').length;
  document.getElementById('stMorado').textContent  = allData.filter(d=>d.SEMAFORO==='MORADO').length;
  document.getElementById('stNoIng').textContent   = allData.filter(d=>d.field_16==='NO').length;
}

// ── MARCAR CAMBIO ───────────────────────────────────────────
function mark(id, field, value, el) {
  if (!pendingChanges[id]) {
    const item = allData.find(d=>(d.ID||d.Id)==id);
    pendingChanges[id] = {
      id,
      SEMAFORO:      item.SEMAFORO||'',
      field_15:      item.field_15||'',
      field_16:      item.field_16||'',
      field_17:      item.field_17||'',
      field_18:      item.field_18||'',
      Observaciones: item.Observaciones||''
    };
    document.getElementById(`row-${id}`).classList.add('modified');
  }
  pendingChanges[id][field] = value;
  if (el) el.classList.add('changed');
  updateBadge();
}

function updateBadge() {
  const n = Object.keys(pendingChanges).length;
  const badge = document.getElementById('changesBadge');
  const btn = document.getElementById('btnSaveAll');
  badge.style.display = n > 0 ? 'inline' : 'none';
  badge.textContent = `${n} cambio${n!==1?'s':''}`;
  btn.disabled = n === 0;
}

// ── GUARDAR FILA ────────────────────────────────────────────
async function guardarFila(id) {
  const item = allData.find(d=>(d.ID||d.Id)==id);
  const payload = pendingChanges[id] || {
    id,
    SEMAFORO: item.SEMAFORO||'', field_15: item.field_15||'',
    field_16: item.field_16||'', field_17: item.field_17||'',
    field_18: item.field_18||'', Observaciones: item.Observaciones||''
  };
  const row = document.getElementById(`row-${id}`);
  const btn = document.getElementById(`btn-${id}`);
  row.classList.add('saving');
  btn.textContent = '⏳';
  btn.disabled = true;
  try {
    const r = await fetch(FLOW_ACTUALIZAR, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    Object.assign(item, payload);
    delete pendingChanges[id];
    row.classList.remove('modified','saving');
    row.classList.add('saved-ok');
    setTimeout(()=>row.classList.remove('saved-ok'), 2500);
    btn.textContent = '✓ Guardado';
    setTimeout(()=>{ btn.textContent='💾 Guardar'; btn.disabled=false; }, 2500);
    updateBadge();
    setStatus(`✓ Estudiante guardado correctamente`, 'ok');
  } catch(e) {
    row.classList.remove('saving');
    btn.textContent = '✗ Error';
    setTimeout(()=>{ btn.textContent='💾 Guardar'; btn.disabled=false; }, 2500);
    setStatus(`✗ Error: ${e.message}`, 'err');
  }
}

// ── GUARDAR TODOS ───────────────────────────────────────────
async function guardarTodos() {
  const ids = Object.keys(pendingChanges);
  if (!ids.length) return;
  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true;
  btn.textContent = '⏳ Guardando...';
  setStatus(`<span class="spinner"></span> Guardando ${ids.length} registros...`, 'loading');
  let ok=0, err=0;
  for (const id of ids) {
    try {
      const r = await fetch(FLOW_ACTUALIZAR, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pendingChanges[id])
      });
      if (!r.ok) throw new Error();
      const item = allData.find(d=>(d.ID||d.Id)==id);
      Object.assign(item, pendingChanges[id]);
      delete pendingChanges[id];
      const row = document.getElementById(`row-${id}`);
      row.classList.remove('modified');
      row.classList.add('saved-ok');
      setTimeout(()=>row.classList.remove('saved-ok'), 2500);
      ok++;
    } catch(e) { err++; }
  }
  updateBadge();
  btn.textContent = '💾 Guardar todos los cambios';
  setStatus(err===0 ? `✓ ${ok} registros guardados` : `⚠️ ${ok} guardados, ${err} con error`, err===0?'ok':'err');
}

// ── FILTRO ──────────────────────────────────────────────────
function filtrarTabla() {
  const q = document.getElementById('searchInline').value.toLowerCase();
  document.querySelectorAll('#tablaBody tr').forEach(row => {
    row.style.display = (!q || row.dataset.nom.includes(q) || row.dataset.rut.includes(q)) ? '' : 'none';
  });
}

// ── STATUS ──────────────────────────────────────────────────
function setStatus(msg, type) {
  document.getElementById('statusBar').innerHTML = `<span class="status-${type}">${msg}</span>`;
}

// ── ENTER ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  ['inputNRC','inputPeriodo'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') buscar(); });
  });

  // Leer parametros de URL y buscar automaticamente
  const params = new URLSearchParams(window.location.search);
  const nrc = params.get('nrc');
  const periodo = params.get('periodo');
  if (nrc && periodo) {
    document.getElementById('inputNRC').value = nrc;
    document.getElementById('inputPeriodo').value = periodo;
    buscar();
  }
});
</script>
</body>
</html>
