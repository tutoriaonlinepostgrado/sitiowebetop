<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centro de Control ETOP · Mockup V5</title>
<style>
  :root{
    --navy:#142440;
    --navy-2:#1c2f50;
    --blue:#0f66e8;
    --blue-soft:#eaf3ff;
    --yellow:#f4c400;
    --bg:#eef3f8;
    --card:#ffffff;
    --text:#14213d;
    --muted:#728197;
    --line:#d9e2ec;
    --red:#ef4444;
    --orange:#f59e0b;
    --green:#10b981;
    --purple:#6d28d9;
    --shadow:0 8px 24px rgba(31,45,61,.08);
    --radius:16px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
  body{overflow-x:hidden}
  button,input,select{font:inherit}

  .app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#122541 0%,#142440 100%);
    color:#fff;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)
  }
  .brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand-mark{display:grid;grid-template-columns:repeat(2,13px);gap:4px}
  .brand-mark span{width:13px;height:13px;border-radius:3px;background:#53a7ff}
  .brand-mark span:nth-child(2){background:#f3b62f}
  .brand-mark span:nth-child(3){background:#2d7de0}
  .brand-mark span:nth-child(4){background:#ff6b54}
  .brand-title{font-size:21px;font-weight:800;letter-spacing:.03em}
  .brand-sub{font-size:11px;color:#c7d3e2;margin-top:2px}

  .nav{padding:10px 8px;overflow:auto;flex:1}
  .nav a,.nav button{
    width:100%;border:0;background:transparent;color:#dbe5ef;text-decoration:none;
    display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:13px;margin:2px 0
  }
  .nav a:hover,.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav .active{background:linear-gradient(90deg,rgba(32,133,255,.33),rgba(32,133,255,.13));border-left:3px solid #3aa0ff;color:#fff}
  .nav .section{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#7f93ab;padding:14px 12px 5px;font-weight:800}
  .nav .chev{margin-left:auto;color:#9bb0c9}
  .nav .go-coord{margin-top:14px;border:1px solid rgba(244,196,0,.45);color:#ffe16d;background:rgba(244,196,0,.06)}
  .help-box{margin:12px;border:1px solid rgba(80,160,255,.32);border-radius:12px;padding:12px;background:rgba(55,125,220,.1)}
  .help-box strong{display:block;font-size:12px;margin-bottom:4px}
  .help-box span{font-size:11px;color:#c9d7e7}
  .userbox{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
  .avatar{width:38px;height:38px;border-radius:50%;background:#8ea0b8;display:grid;place-items:center;font-weight:800}
  .userbox b{display:block;font-size:12px}
  .userbox small{color:#9fb0c4}

  .main{min-width:0}
  .topbar{
    background:#f7f9fc;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;
    position:sticky;top:0;z-index:20
  }
  .title h1{margin:0;font-size:26px;line-height:1}
  .title p{margin:5px 0 0;color:var(--muted);font-size:12px}
  .datebox{text-align:right;font-size:11px;color:#64748b}
  .datebox b{display:block;color:#14213d;font-size:13px;margin-top:2px}
  .motto{border-left:1px solid var(--line);padding-left:16px;font-size:11px;color:#4c6380;text-align:right;line-height:1.25}

  .content{padding:14px}
  .search-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;align-items:start;margin-bottom:14px}
  .search-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);position:relative}
  .search-row{display:flex;gap:8px}
  .search-input{
    flex:1;display:flex;align-items:center;gap:9px;border:2px solid #2d7de0;border-radius:10px;padding:0 12px;background:#fff;
  }
  .search-input input{border:0;outline:0;width:100%;height:40px;color:#1e293b}
  .search-btn{border:0;border-radius:9px;background:#1265df;color:white;font-weight:700;padding:0 24px;cursor:pointer}
  .search-btn:hover{background:#0d57c2}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:#64748b}
  .chip{background:#f4f7fb;border:1px solid #d9e2ec;border-radius:99px;padding:4px 10px;cursor:pointer}
  .chip:hover{border-color:#8ab8f8;color:#0f5fd5}
  .advanced{height:66px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;box-shadow:var(--shadow);font-size:12px;color:#53667d}
  .search-results{display:none;position:absolute;left:50%;transform:translateX(-30%);top:76px;width:min(470px,78vw);background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 42px rgba(15,23,42,.18);z-index:15;padding:10px}
  .search-results.show{display:block}
  .result-group{padding:8px}
  .result-group b{font-size:11px}
  .result-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:9px;margin-top:5px;background:#f8fafc}
  .result-item:hover{background:#eef5ff}
  .result-icon{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;background:#e8f2ff}
