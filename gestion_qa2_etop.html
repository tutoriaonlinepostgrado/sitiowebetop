<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Incidencias QA2 - ETOP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }
        .login-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 1000;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .qa-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .login-card h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .helper-text {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #dc2626;
            font-size: 13px;
            display: none;
        }
        .error-box.show { display: block; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* APP LAYOUT */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        .app-container.active { display: flex; }
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-stats {
            display: flex;
            gap: 24px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 2px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-logout:hover { background: #dc2626; }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #0f172a;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 12px;
            flex-shrink: 0;
        }
        .nrc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nrc-item {
            padding: 10px 12px;
            background: #1e293b;
            border-left: 3px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #cbd5e1;
        }
        .nrc-item:hover { background: #334155; }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f172a;
        }
        .filters {
            padding: 16px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .filter-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        input[type="text"] {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            flex: 1;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .incidents-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .incident-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .incident-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .incident-title {
            font-weight: 700;
            color: #f1f5f9;
            font-size: 14px;
        }
        .incident-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .incident-body {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: #64748b;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 2000;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="qa-badge">QA</div>
        <h1>Gestión de Incidencias QA2</h1>
        <p>Equipo de Tutoría Online de Postgrado — ETOP<br>Revisa el estado de tus cursos</p>
        <div class="error-box" id="errorBox"></div>
        <button class="btn-login" id="loginBtn" onclick="enterApp()">
            <span id="loginBtnText">🔐 Entrar a la App</span>
        </button>
        <p class="helper-text">Carga los datos de los cursos</p>
    </div>
</div>

<!-- APP -->
<div class="app-container" id="appContainer">
    <div class="topbar">
        <div class="topbar-title">
            <span style="color: #3b82f6; font-size: 24px;">QA</span>
            Gestión de Incidencias QA2
        </div>
        <div class="topbar-stats">
            <div class="stat-item">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statNrc">0</div>
                <div class="stat-label">NRCs</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">Salir</button>
    </div>

    <div class="content">
        <div class="sidebar">
            <div style="margin-bottom: 12px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">NRCs</div>
            <div class="nrc-list" id="nrcList"></div>
        </div>

        <div class="main-panel">
            <div class="filters">
                <div class="filter-row">
                    <input type="text" id="searchInput" placeholder="Buscar por NRC, tutor, curso..." />
                </div>
            </div>

            <div class="incidents-scroll" id="incidentsContainer">
                <div class="empty-state"><p>⏳ Cargando...</p></div>
            </div>
        </div>
    </div>
</div>

<script>
const FLOW_URL = 'https://default8fbed393d03b49f8be79cd5e1f590f.b2.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e5dd388e533f4395a3afe603a392b0b2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AFu5zh6fcWXooO2bMoK-7P4AaTLp_YTgemlfBXqq24g';

let allData = [];

async function enterApp() {
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span>Cargando...';
    
    try {
        await loadData();
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('appContainer').classList.add('active');
    } catch (err) {
        showError('Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btnText.textContent = '🔐 Entrar a la App';
    }
}

async function loadData() {
    try {
        const response = await fetch(FLOW_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'read' })
        });

        if (!response.ok) throw new Error(`Error ${response.status}`);
        
        const result = await response.json();
        allData = result.items || [];
        
        if (!Array.isArray(allData)) {
            allData = [];
        }

        renderData();
    } catch (err) {
        console.error('Load error:', err);
        throw new Error('No se pudieron cargar los datos: ' + err.message);
    }
}

function renderData() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(item => {
        return !search || 
            (item.Title || '').toLowerCase().includes(search) ||
            (item.field_10 || '').toLowerCase().includes(search) ||
            (item.field_6 || '').toLowerCase().includes(search);
    });

    updateStats(filtered);
    renderNrcList(filtered);
    renderIncidents(filtered);
}

function renderNrcList(data) {
    const nrcs = [...new Set(data.map(i => i.Title).filter(Boolean))].sort();
    document.getElementById('nrcList').innerHTML = nrcs.map(nrc => {
        const count = data.filter(i => i.Title === nrc).length;
        return `<div class="nrc-item" onclick="filterByNrc('${nrc}')">${nrc} (${count})</div>`;
    }).join('');
}

function renderIncidents(data) {
    const container = document.getElementById('incidentsContainer');
    
    if (!data.length) {
        container.innerHTML = '<div class="empty-state"><p>✓ Sin registros</p></div>';
        return;
    }

    container.innerHTML = data.map((item, idx) => {
        return `
            <div class="incident-card">
                <div class="incident-header">
                    <div>
                        <div class="incident-title">${item.field_6 || 'Sin nombre'}</div>
                        <div class="incident-subtitle">NRC: ${item.Title || 'N/A'}</div>
                    </div>
                </div>
                <div class="incident-body">
                    <strong>Tutor:</strong> ${item.field_10 || 'N/A'}<br>
                    <strong>Incidencia:</strong> ${item.field_18 || 'N/A'}<br>
                    <strong>Estado:</strong> ${item.field_19 || 'N/A'}<br>
                    <strong>Categoría:</strong> ${item.CATEGORIA || 'N/A'}
                </div>
            </div>
        `;
    }).join('');
}

function filterByNrc(nrc) {
    document.getElementById('searchInput').value = nrc;
    renderData();
}

function updateStats(data) {
    document.getElementById('statTotal').textContent = data.length;
    document.getElementById('statNrc').textContent = new Set(data.map(i => i.Title).filter(Boolean)).size;
}

function logout() {
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('appContainer').classList.remove('active');
    document.getElementById('searchInput').value = '';
    allData = [];
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 5000);
}

document.getElementById('searchInput').addEventListener('input', renderData);
</script>

</body>
</html>
