<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Incidencias QA2 - ETOP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }
        .login-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 1000;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .qa-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .login-card h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .helper-text {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #dc2626;
            font-size: 13px;
            display: none;
        }
        .error-box.show { display: block; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* APP LAYOUT */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        .app-container.active { display: flex; }
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-stats {
            display: flex;
            gap: 24px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 2px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: #dc2626; }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #0f172a;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 12px;
            flex-shrink: 0;
        }
        .nrc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nrc-item {
            padding: 10px 12px;
            background: #1e293b;
            border-left: 3px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #cbd5e1;
        }
        .nrc-item:hover { background: #334155; }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f172a;
        }
        .filters {
            padding: 16px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .filter-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        input[type="text"], input[type="date"] {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn-clear {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-clear:hover { background: #dc2626; }

        .incidents-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .incident-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .incident-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .incident-title {
            font-weight: 700;
            color: #f1f5f9;
            font-size: 14px;
        }
        .incident-status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-corrected { background: #d1fae5; color: #065f46; }
        .incident-body {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .incident-actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #334155;
        }
        select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            flex: 1;
        }
        .btn-save {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-save:hover { background: #16a34a; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 2000;
        }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="qa-badge">QA</div>
        <h1>Gestión de Incidencias QA2</h1>
        <p>Equipo de Tutoría Online de Postgrado — ETOP<br>Inicia sesión con tu cuenta institucional UNAB.</p>
        <div class="error-box" id="errorBox"></div>
        <button class="btn-login" id="loginBtn" onclick="login()">
            <span id="loginBtnText">🔐 Iniciar sesión con cuenta UNAB</span>
        </button>
        <p class="helper-text">Se abrirá una ventana de Microsoft para autenticarte</p>
    </div>
</div>

<!-- APP -->
<div class="app-container" id="appContainer">
    <div class="topbar">
        <div class="topbar-title">
            <span style="color: #3b82f6; font-size: 24px;">QA</span>
            Gestión de Incidencias QA2
        </div>
        <div class="topbar-stats">
            <div class="stat-item">
                <div class="stat-value" id="statNrc">0</div>
                <div class="stat-label">NRCs</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statIncidents">0</div>
                <div class="stat-label">Incidencias</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="content">
        <div class="sidebar">
            <div style="margin-bottom: 12px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">NRCs</div>
            <div class="nrc-list" id="nrcList"></div>
        </div>

        <div class="main-panel">
            <div class="filters">
                <div class="filter-row">
                    <input type="text" id="searchInput" placeholder="Buscar..." style="flex: 1;">
                </div>
            </div>

            <div class="incidents-scroll" id="incidentsContainer">
                <div class="empty-state"><p>⏳ Cargando...</p></div>
            </div>
        </div>
    </div>
</div>

<script>
const CONFIG = {
    clientId: '57fb890c-0dab-4253-a5e0-7188c88b2bb6',
    tenantId: '8fbed393-d03b-49f8-be79-cd5e1f590fb2',
    siteId: '5adebafe-b8b3-4dff-b344-6bab643de1fb',
    listId: 'NRC_TUTOR_QA2_INCIDENCIA',
    redirectUri: window.location.origin + window.location.pathname
};

let allData = [];
let token = null;

async function login() {
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span>Autenticando...';
    
    try {
        // Paso 1: Solicita código de autorización
        const authUrl = new URL('https://login.microsoftonline.com/' + CONFIG.tenantId + '/oauth2/v2.0/authorize');
        authUrl.searchParams.append('client_id', CONFIG.clientId);
        authUrl.searchParams.append('redirect_uri', CONFIG.redirectUri);
        authUrl.searchParams.append('response_type', 'token');
        authUrl.searchParams.append('scope', 'https://unabportal365.sharepoint.com/.default');
        authUrl.searchParams.append('response_mode', 'fragment');

        // Abre popup
        const popup = window.open(authUrl.toString(), 'login', 'width=600,height=700');
        
        // Espera respuesta
        const received = await waitForToken(popup);
        if (!received) {
            showError('Autenticación cancelada o bloqueada');
            return;
        }

        // Entra a la app
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('appContainer').classList.add('active');
        await loadData();
    } catch (err) {
        showError('Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btnText.textContent = '🔐 Iniciar sesión con cuenta UNAB';
    }
}

function waitForToken(popup) {
    return new Promise((resolve) => {
        const checkToken = () => {
            try {
                if (!popup || popup.closed) {
                    // Popup cerrado, intenta leer hash del actual
                    const hash = window.location.hash;
                    if (hash.includes('access_token=')) {
                        const params = new URLSearchParams(hash.substring(1));
                        token = params.get('access_token');
                        window.location.hash = '';
                        resolve(!!token);
                        return;
                    }
                    resolve(false);
                    return;
                }
                setTimeout(checkToken, 100);
            } catch (e) {
                resolve(false);
            }
        };
        checkToken();
    });
}

async function loadData() {
    try {
        if (!token) {
            showError('No hay token de autenticación');
            return;
        }

        const url = `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteId}/lists/${CONFIG.listId}/items?$top=500&$select=fields`;
        
        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 401) {
            token = null;
            logout();
            return;
        }

        if (!response.ok) throw new Error(`Error ${response.status}`);
        
        const result = await response.json();
        allData = (result.value || []).map(item => ({
            ...item.fields,
            ID: item.id
        }));

        renderData();
    } catch (err) {
        showError('Error al cargar datos: ' + err.message);
    }
}

function renderData() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allData.filter(item => {
        return !search || 
            (item.Title || '').toLowerCase().includes(search) ||
            (item.field_10 || '').toLowerCase().includes(search) ||
            (item.field_6 || '').toLowerCase().includes(search);
    });

    updateStats(filtered);
    renderNrcList(filtered);
    renderIncidents(filtered);
}

function renderNrcList(data) {
    const nrcs = [...new Set(data.map(i => i.Title))].sort();
    document.getElementById('nrcList').innerHTML = nrcs.map(nrc => {
        const count = data.filter(i => i.Title === nrc).length;
        return `<div class="nrc-item">${nrc} (${count})</div>`;
    }).join('');
}

function renderIncidents(data) {
    const container = document.getElementById('incidentsContainer');
    
    if (!data.length) {
        container.innerHTML = '<div class="empty-state"><p>✓ Sin incidencias</p></div>';
        return;
    }

    container.innerHTML = data.map((item, idx) => {
        const status = item.field_19 === 'CORREGIDA' ? 'Corregida' : 'Pendiente';
        const statusClass = status === 'Corregida' ? 'status-corrected' : 'status-pending';
        
        return `
            <div class="incident-card">
                <div class="incident-header">
                    <div>
                        <div class="incident-title">${item.field_6 || 'Sin nombre'}</div>
                        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">NRC: ${item.Title}</div>
                    </div>
                    <div class="incident-status ${statusClass}">${status}</div>
                </div>
                <div class="incident-body">
                    <strong>Incidencia:</strong> ${item.field_18 || 'N/A'}<br>
                    <strong>Tutor:</strong> ${item.field_10 || 'N/A'}
                </div>
                <div class="incident-actions">
                    <select id="status-${idx}">
                        <option value="">-- Estado --</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="CORREGIDA">Corregida</option>
                    </select>
                    <button class="btn-save" onclick="saveIncident('${item.ID}', ${idx})">Guardar</button>
                </div>
            </div>
        `;
    }).join('');
}

async function saveIncident(itemId, idx) {
    const newStatus = document.getElementById(`status-${idx}`).value;
    if (!newStatus) return;

    try {
        const body = {
            fields: {
                field_19: newStatus,
                field_20: 'Actualizado desde QA2'
            }
        };

        const response = await fetch(
            `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteId}/lists/${CONFIG.listId}/items/${itemId}`,
            {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            }
        );

        if (!response.ok) throw new Error(`Error ${response.status}`);
        
        showToast(`✓ Actualizado a "${newStatus}"`);
        setTimeout(() => loadData(), 1000);
    } catch (err) {
        showError('Error: ' + err.message);
    }
}

function logout() {
    token = null;
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('appContainer').classList.remove('active');
    window.location.hash = '';
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 5000);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function updateStats(data) {
    document.getElementById('statNrc').textContent = new Set(data.map(i => i.Title)).size;
    document.getElementById('statIncidents').textContent = data.length;
    document.getElementById('statPending').textContent = data.filter(i => i.field_19 !== 'CORREGIDA').length;
}

document.getElementById('searchInput').addEventListener('input', renderData);

// Auto-login si hay token en URL
window.addEventListener('load', () => {
    const hash = window.location.hash;
    if (hash.includes('access_token=')) {
        const params = new URLSearchParams(hash.substring(1));
        token = params.get('access_token');
        window.location.hash = '';
        if (token) {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            loadData();
        }
    }
});
</script>

</body>
</html>
