<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Incidencias QA2 - ETOP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-authentication-library-for-js/2.38.4/msal.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }
        .login-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 1000;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .qa-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
            color: white;
        }
        .login-card h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3); }
        .btn-login:active { transform: translateY(0); }
        .helper-text {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #dc2626;
            font-size: 13px;
            display: none;
        }
        .error-box.show { display: block; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* APP LAYOUT */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        .app-container.active { display: flex; }
        .topbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-stats {
            display: flex;
            gap: 24px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 2px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: #dc2626; }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #0f172a;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 12px;
            flex-shrink: 0;
        }
        .nrc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nrc-item {
            padding: 10px 12px;
            background: #1e293b;
            border-left: 3px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #cbd5e1;
        }
        .nrc-item:hover { background: #334155; }
        .nrc-item.active {
            background: #3b82f6;
            border-left-color: #1e40af;
            color: white;
            font-weight: 600;
        }
        .nrc-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f172a;
        }
        .filters {
            padding: 16px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .filter-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        .filter-row:last-child { margin-bottom: 0; }
        input[type="text"], input[type="date"] {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-clear {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover { background: #dc2626; }

        .incidents-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .incident-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .incident-card:hover { border-color: #3b82f6; background: #1e293b; }
        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .incident-title {
            font-weight: 700;
            color: #f1f5f9;
            font-size: 14px;
        }
        .incident-status {
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-corrected { background: #d1fae5; color: #065f46; }
        .incident-body {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .incident-actions {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #334155;
        }
        select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            flex: 1;
        }
        .btn-save {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-save:hover { background: #16a34a; }
        .btn-save:disabled { background: #6b7280; cursor: not-allowed; opacity: 0.6; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
            z-index: 2000;
        }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: #64748b;
        }
        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="qa-badge">QA</div>
        <h1>Gestión de Incidencias QA2</h1>
        <p>Equipo de Tutoría Online de Postgrado — ETOP<br>Inicia sesión con tu cuenta institucional UNAB.</p>
        <div class="error-box" id="errorBox"></div>
        <button class="btn-login" id="loginBtn" onclick="login()">
            <span id="loginBtnText">🔐 Iniciar sesión con cuenta UNAB</span>
        </button>
        <p class="helper-text">Se abrirá una ventana de Microsoft para autenticarte</p>
    </div>
</div>

<!-- APP -->
<div class="app-container" id="appContainer">
    <div class="topbar">
        <div class="topbar-title">
            <span style="color: #3b82f6; font-size: 24px;">QA</span>
            Gestión de Incidencias QA2
        </div>
        <div class="topbar-stats">
            <div class="stat-item">
                <div class="stat-value" id="statNrc">0</div>
                <div class="stat-label">NRCs</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statIncidents">0</div>
                <div class="stat-label">Incidencias</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="content">
        <div class="sidebar">
            <div style="margin-bottom: 12px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">NRCs</div>
            <div class="nrc-list" id="nrcList"></div>
        </div>

        <div class="main-panel">
            <div class="filters">
                <div class="filter-row">
                    <input type="text" id="searchInput" placeholder="Buscar por NRC, tutor, curso..." style="flex: 1;">
                </div>
                <div class="filter-row">
                    <label style="font-size: 12px; color: #94a3b8; white-space: nowrap;">Desde:</label>
                    <input type="date" id="dateFrom" style="flex: 1;">
                    <label style="font-size: 12px; color: #94a3b8; white-space: nowrap;">Hasta:</label>
                    <input type="date" id="dateTo" style="flex: 1;">
                    <button class="btn-clear" onclick="clearDateFilters()">✕ Limpiar</button>
                </div>
            </div>

            <div class="incidents-scroll" id="incidentsContainer">
                <div class="empty-state"><p>⏳ Cargando incidencias...</p></div>
            </div>
        </div>
    </div>
</div>

<script>
// ============ MSAL Configuration ============
const msalConfig = {
    auth: {
        clientId: '57fb890c-0dab-4253-a5e0-7188c88b2bb6',
        authority: 'https://login.microsoftonline.com/8fbed393-d03b-49f8-be79-cd5e1f590fb2',
        redirectUri: window.location.origin + window.location.pathname
    },
    cache: {
        cacheLocation: 'sessionStorage',
        storeAuthStateInCookie: false
    }
};

const loginRequest = {
    scopes: ['https://unabportal365.sharepoint.com/.default']
};

let msalInstance;
let allData = [];
let filteredData = [];

// ============ MSAL Initialization ============
async function initializeMSAL() {
    try {
        msalInstance = new msal.PublicClientApplication(msalConfig);
        await msalInstance.initialize();
        await checkExistingSession();
    } catch (err) {
        console.error('MSAL init error:', err);
        showError('Error al inicializar autenticación: ' + err.message);
    }
}

async function checkExistingSession() {
    try {
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
            msalInstance.setActiveAccount(accounts[0]);
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            await loadData();
        }
    } catch (err) {
        console.error('Session check error:', err);
    }
}

// ============ Authentication ============
async function login() {
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span>Autenticando...';
    
    try {
        const response = await msalInstance.loginPopup(loginRequest);
        msalInstance.setActiveAccount(response.account);
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('appContainer').classList.add('active');
        await loadData();
    } catch (err) {
        if (err.errorCode === 'popup_window_blocked') {
            showError('Popup bloqueado. Permite popups para continuar.');
        } else if (err.errorCode === 'user_cancelled') {
            showError('Autenticación cancelada');
        } else {
            showError('Error: ' + (err.errorDescription || err.message));
        }
    } finally {
        btn.disabled = false;
        btnText.textContent = '🔐 Iniciar sesión con cuenta UNAB';
    }
}

function logout() {
    msalInstance.logoutPopup({
        postLogoutRedirectUri: window.location.origin + window.location.pathname
    });
}

// ============ Data Loading ============
async function loadData() {
    try {
        const accounts = msalInstance.getAllAccounts();
        if (!accounts.length) {
            showError('Sesión expirada. Recarga la página.');
            return;
        }
        
        const token = await msalInstance.acquireTokenSilent({
            scopes: loginRequest.scopes,
            account: accounts[0]
        });

        const siteId = '5adebafe-b8b3-4dff-b344-6bab643de1fb';
        const listId = 'NRC_TUTOR_QA2_INCIDENCIA';
        
        // Filtro base: field_17 ne 'NO APLICA'
        const filter = encodeURIComponent("fields/field_17 ne 'NO APLICA'");
        const url = `https://graph.microsoft.com/v1.0/sites/${siteId}/lists/${listId}/items?$filter=${filter}&$top=500&$select=fields`;

        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token.accessToken}` }
        });

        if (!response.ok) throw new Error(`Graph API error: ${response.status}`);
        
        const result = await response.json();
        allData = (result.value || []).map(item => item.fields);
        
        renderData();
        updateStats();
    } catch (err) {
        console.error('Data load error:', err);
        showError('Error al cargar datos: ' + err.message);
    }
}

// ============ Filtering & Rendering ============
function filterData() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;

    filteredData = allData.filter(item => {
        const matchSearch = !search || 
            (item.Title || '').toLowerCase().includes(search) ||
            (item.field_10 || '').toLowerCase().includes(search) ||
            (item.field_6 || '').toLowerCase().includes(search);

        let matchDate = true;
        if (dateFrom) {
            const itemDate = new Date(item.field_7);
            matchDate = !dateFrom || itemDate >= new Date(dateFrom);
        }
        if (dateTo && matchDate) {
            const itemDate = new Date(item.field_7);
            matchDate = !dateTo || itemDate <= new Date(dateTo);
        }

        return matchSearch && matchDate;
    });
}

function renderData() {
    filterData();
    updateStats();
    renderNrcList();
    renderIncidents();
}

function renderNrcList() {
    const nrcs = [...new Set(allData.map(i => i.Title))].sort();
    const container = document.getElementById('nrcList');
    container.innerHTML = nrcs.map(nrc => {
        const count = filteredData.filter(i => i.Title === nrc && i.field_17 !== 'NO APLICA').length;
        const status = count > 0 ? '🔴' : '🟢';
        return `<div class="nrc-item" onclick="filterByNrc('${nrc}')">${status} ${nrc} (${count})</div>`;
    }).join('');
}

function renderIncidents() {
    const container = document.getElementById('incidentsContainer');
    if (!filteredData.length) {
        container.innerHTML = '<div class="empty-state"><p>✓ Sin incidencias a mostrar</p></div>';
        return;
    }

    container.innerHTML = filteredData.map((item, idx) => {
        const status = item.field_19 === 'CORREGIDA' ? 'Corregida' : 'Pendiente';
        const statusClass = status === 'Corregida' ? 'status-corrected' : 'status-pending';
        
        return `
            <div class="incident-card">
                <div class="incident-header">
                    <div>
                        <div class="incident-title">${item.field_6 || 'Sin nombre'}</div>
                        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">NRC: ${item.Title}</div>
                    </div>
                    <div class="incident-status ${statusClass}">${status}</div>
                </div>
                <div class="incident-body">
                    <strong>Incidencia:</strong> ${item.field_18 || 'N/A'}<br>
                    <strong>Tutor:</strong> ${item.field_10 || 'N/A'}<br>
                    <strong>Categoría:</strong> ${item.CATEGORIA || 'N/A'}
                </div>
                <div class="incident-actions">
                    <select id="status-${idx}" value="${item.field_19 || ''}">
                        <option value="">-- Cambiar estado --</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="CORREGIDA">Corregida</option>
                    </select>
                    <button class="btn-save" onclick="saveIncident(${item.ID}, ${idx})">Guardar</button>
                </div>
            </div>
        `;
    }).join('');
}

async function saveIncident(itemId, idx) {
    const newStatus = document.getElementById(`status-${idx}`).value;
    if (!newStatus) return;

    const item = filteredData[idx];
    if (newStatus === 'CORREGIDA' && !item.field_20) {
        showError('Requiere descripción de solución para marcar como Corregida');
        return;
    }

    try {
        const siteId = '5adebafe-b8b3-4dff-b344-6bab643de1fb';
        const listId = 'NRC_TUTOR_QA2_INCIDENCIA';
        
        const body = {
            fields: {
                field_19: newStatus,
                field_20: item.field_20 || 'Marcado como corregido'
            }
        };

        const accounts = msalInstance.getAllAccounts();
        const token = await msalInstance.acquireTokenSilent({
            scopes: loginRequest.scopes,
            account: accounts[0]
        });

        const response = await fetch(`https://graph.microsoft.com/v1.0/sites/${siteId}/lists/${listId}/items/${itemId}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${token.accessToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!response.ok) throw new Error(`Update failed: ${response.status}`);
        
        item.field_19 = newStatus;
        renderIncidents();
        showToast(`✓ Incidencia actualizada a "${newStatus}"`);
        
        // Reload datos after update
        setTimeout(() => loadData(), 1500);
    } catch (err) {
        showError('Error al actualizar: ' + err.message);
    }
}

function filterByNrc(nrc) {
    document.getElementById('searchInput').value = nrc;
    filterData();
    renderNrcList();
    renderIncidents();
}

function clearDateFilters() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    filterData();
    renderIncidents();
}

function updateStats() {
    const nrcCount = new Set(filteredData.map(i => i.Title)).size;
    const incidentCount = filteredData.length;
    const pendingCount = filteredData.filter(i => i.field_19 !== 'CORREGIDA').length;

    document.getElementById('statNrc').textContent = nrcCount;
    document.getElementById('statIncidents').textContent = incidentCount;
    document.getElementById('statPending').textContent = pendingCount;
}

function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 5000);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// ============ Event Listeners ============
document.getElementById('searchInput').addEventListener('input', () => {
    filterData();
    renderIncidents();
});

document.getElementById('dateFrom').addEventListener('change', () => {
    filterData();
    renderIncidents();
});

document.getElementById('dateTo').addEventListener('change', () => {
    filterData();
    renderIncidents();
});

// ============ Initialize on Load ============
window.addEventListener('load', initializeMSAL);
</script>

</body>
</html>
