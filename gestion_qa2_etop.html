<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Incidencias QA2 - ETOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
        }
        .header-subtitle {
            font-size: 12px;
            color: #64748b;
        }
        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
        }
        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .btn-reload {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-reload:hover { background: #2563eb; }
        .btn-reload:disabled { opacity: 0.6; cursor: not-allowed; }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 24px;
            overflow-y: auto;
        }
        .sidebar-section {
            margin-bottom: 24px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .search-box:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .date-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .date-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .date-row input { flex: 1; }
        .date-row span { color: #94a3b8; font-size: 12px; white-space: nowrap; }
        .btn-clear {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-clear:hover { background: #dc2626; }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 6px 12px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-btn:hover { border-color: #3b82f6; }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .incidents-grid {
            display: grid;
            gap: 12px;
        }
        .incident-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s;
        }
        .incident-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .incident-title {
            font-weight: 700;
            color: #1e293b;
            font-size: 14px;
        }
        .incident-nrc {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
        .incident-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-corrected { background: #d1fae5; color: #065f46; }
        .incident-body {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: #94a3b8;
        }
        .empty-state p {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 24px;
            color: #94a3b8;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            padding: 16px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
            margin: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="logo">QA</div>
            <div>
                <div class="header-title">Gestión de Incidencias QA2</div>
                <div class="header-subtitle">Equipo de Tutoría Online de Postgrado — ETOP</div>
            </div>
        </div>
        <div class="header-right">
            <div class="stat">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statNrc">0</div>
                <div class="stat-label">NRCs</div>
            </div>
            <button class="btn-reload" id="reloadBtn" onclick="loadData()">⟳ Recargar</button>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Búsqueda</div>
                <input type="text" id="searchInput" class="search-box" placeholder="Buscar NRC o tutor...">
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Fecha inicio del curso</div>
                <div class="date-row">
                    <span>Desde:</span>
                    <input type="date" id="dateFrom" class="date-input">
                </div>
                <div class="date-row">
                    <span>Hasta:</span>
                    <input type="date" id="dateTo" class="date-input">
                </div>
                <button class="btn-clear" onclick="clearDates()">✕ Limpiar fechas</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Estado</div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="filterByStatus('all')">Todos</button>
                    <button class="tab-btn" onclick="filterByStatus('with')">Con Incidencia</button>
                    <button class="tab-btn" onclick="filterByStatus('pending')">Pendiente</button>
                    <button class="tab-btn" onclick="filterByStatus('corrected')">Corregida</button>
                </div>
            </div>
        </div>

        <!-- MAIN -->
        <div class="main">
            <div id="container"></div>
        </div>
    </div>
</div>

<script>
const FLOW_URL = 'https://default8fbed393d03b49f8be79cd5e1f590f.b2.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e5dd388e533f4395a3afe603a392b0b2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AFu5zh6fcWXooO2bMoK-7P4AaTLp_YTgemlfBXqq24g';

let allData = [];
let currentStatus = 'all';

async function loadData() {
    const btn = document.getElementById('reloadBtn');
    btn.disabled = true;
    
    const container = document.getElementById('container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando datos...</p></div>';
    
    try {
        const response = await fetch(FLOW_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'read' })
        });

        if (!response.ok) throw new Error(`Error ${response.status}`);
        
        const result = await response.json();
        allData = result.items || [];
        
        if (!Array.isArray(allData)) allData = [];

        renderData();
    } catch (err) {
        container.innerHTML = `<div class="error-msg">⚠️ Error al cargar: ${err.message}<br><small>Verifica que tu sesión en SharePoint sea válida</small></div>`;
    } finally {
        btn.disabled = false;
    }
}

function renderData() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;

    let filtered = allData.filter(item => {
        // Búsqueda
        const matchSearch = !search || 
            (item.Title || '').toLowerCase().includes(search) ||
            (item.field_10 || '').toLowerCase().includes(search) ||
            (item.field_6 || '').toLowerCase().includes(search);

        // Fechas
        let matchDate = true;
        if (dateFrom || dateTo) {
            const itemDate = item.field_7 ? new Date(item.field_7) : null;
            if (dateFrom && itemDate) matchDate = itemDate >= new Date(dateFrom);
            if (dateTo && itemDate && matchDate) matchDate = itemDate <= new Date(dateTo);
        }

        // Estado
        let matchStatus = true;
        if (currentStatus === 'pending') matchStatus = item.field_19 !== 'CORREGIDA';
        else if (currentStatus === 'corrected') matchStatus = item.field_19 === 'CORREGIDA';
        else if (currentStatus === 'with') matchStatus = item.field_17 && item.field_17 !== 'NO APLICA';

        return matchSearch && matchDate && matchStatus;
    });

    updateStats(filtered);
    renderIncidents(filtered);
}

function renderIncidents(data) {
    const container = document.getElementById('container');
    
    if (!data.length) {
        container.innerHTML = '<div class="empty-state"><p>✓ Sin registros que coincidan</p></div>';
        return;
    }

    container.innerHTML = `<div class="incidents-grid">${data.map(item => `
        <div class="incident-card">
            <div class="incident-header">
                <div>
                    <div class="incident-title">${item.field_6 || 'Sin nombre'}</div>
                    <div class="incident-nrc">NRC: ${item.Title || 'N/A'}</div>
                </div>
                <span class="incident-badge ${item.field_19 === 'CORREGIDA' ? 'badge-corrected' : 'badge-pending'}">
                    ${item.field_19 === 'CORREGIDA' ? 'Corregida' : 'Pendiente'}
                </span>
            </div>
            <div class="incident-body">
                <strong>Tutor:</strong> ${item.field_10 || 'N/A'}<br>
                <strong>Incidencia:</strong> ${item.field_18 || 'N/A'}<br>
                <strong>Categoría:</strong> ${item.CATEGORIA || 'N/A'}<br>
                <strong>Fecha inicio:</strong> ${item.field_7 ? new Date(item.field_7).toLocaleDateString('es-CL') : 'N/A'}
            </div>
        </div>
    `).join('')}</div>`;
}

function updateStats(data) {
    document.getElementById('statTotal').textContent = data.length;
    document.getElementById('statNrc').textContent = new Set(data.map(i => i.Title).filter(Boolean)).size;
}

function filterByStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderData();
}

function clearDates() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    renderData();
}

document.getElementById('searchInput').addEventListener('input', renderData);
document.getElementById('dateFrom').addEventListener('change', renderData);
document.getElementById('dateTo').addEventListener('change', renderData);

// Cargar datos al iniciar
window.addEventListener('load', loadData);
</script>

</body>
</html>
