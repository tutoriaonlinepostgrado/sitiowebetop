<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Incidencias QA2 - UNAB Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --unab-blue: #003366;
            --unab-red: #e30613;
            --unab-gold: #c5a347;
            --bg-light: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--unab-blue);
            text-align: center;
            border-bottom: 3px solid var(--unab-gold);
            padding-bottom: 10px;
        }

        #login-section {
            text-align: center;
            padding: 50px 0;
        }

        .btn-principal {
            background-color: var(--unab-blue);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-principal:hover {
            background-color: #002244;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: var(--unab-blue);
            color: white;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .pendiente { background-color: #ffeeba; color: #856404; }
        .corregido { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Gestión de Incidencias QA2</h1>

    <div id="login-section">
        <p>Conéctate para cargar las incidencias desde SharePoint.</p>
        <button id="loginBtn" class="btn-principal" onclick="inicializarApp()">
            🔐 Cargar Datos de Incidencias
        </button>
    </div>

    <div id="app-content" style="display: none;">
        <div id="stats-summary" style="margin-bottom: 20px; font-weight: 600;"></div>
        <table id="incidencias-table">
            <thead>
                <tr>
                    <th>NRC</th>
                    <th>Tutor</th>
                    <th>Incidencia</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    // URL de tu Flujo de Power Automate
    const URL_FLUJO_LEER = 'https://default8fbed393d03b49f8be79cd5e1f590f.b2.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e5dd388e533f4395a3afe603a392b0b2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AFu5zh6fcWXooO2bMoK-7P4AaTLp_YTgemlfBXqq24g';

    let allData = [];

    // Función principal que se activa al hacer clic
    async function inicializarApp() {
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerText = '⌛ Cargando...';

        try {
            await loadData();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        } catch (error) {
            alert('Error al conectar con Power Automate. Revisa la consola.');
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerText = '🔐 Cargar Datos de Incidencias';
        }
    }

    // Carga de datos mediante el flujo HTTP
    async function loadData() {
        const response = await fetch(URL_FLUJO_LEER, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "read" })
        });

        if (!response.ok) throw new Error("Fallo en la respuesta del servidor");

        const data = await response.json();
        
        // Asignamos los datos (SharePoint suele devolverlos en un array)
        allData = data; 
        renderTable();
    }

    // Dibujar la tabla en el HTML
    function renderTable() {
        const tbody = document.getElementById('tabla-body');
        tbody.innerHTML = '';

        allData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.NRC || 'N/A'}</td>
                <td>${item.Tutor || 'N/A'}</td>
                <td>${item.Incidencia || 'Sin detalle'}</td>
                <td>
                    <span class="status-badge ${item.Estado === 'Corregida' ? 'corregido' : 'pendiente'}">
                        ${item.Estado || 'Pendiente'}
                    </span>
                </td>
                <td>
                    <button onclick="marcarCorregido(${item.ID})">✅ Marcar</button>
                </td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('stats-summary').innerText = `Total incidencias encontradas: ${allData.length}`;
    }

    async function marcarCorregido(id) {
        alert('Para guardar cambios, necesitas crear el segundo flujo de "Actualizar" en Power Automate con el ID: ' + id);
    }
</script>

</body>
</html>
