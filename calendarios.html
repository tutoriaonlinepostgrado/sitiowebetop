<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendarios ETOP</title>
  <style>
    :root{--bg:#202733;--panel:#293340;--panel-soft:#252e3a;--line:#3a4552;--accent:#8192a8;--text:#d8dee7;--muted:#9aa7b7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{padding:12px;-webkit-font-smoothing:antialiased}.header{display:flex;justify-content:space-between;align-items:center;gap:22px;background:var(--panel-soft);border:1px solid var(--line);border-radius:9px;padding:12px 16px;margin-bottom:10px}
    .header-grid{display:grid;grid-template-columns:max-content minmax(120px,1fr) max-content minmax(120px,1fr);gap:7px 22px;font-size:11.5px;flex:1}.h-label{color:#919eae;font-weight:700}.h-value{color:var(--text);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.h-value.up{text-transform:uppercase}.h-value.green{color:#9bbfaf}.h-value.code{color:#b8c4d2;font-family:monospace;font-weight:700}
    .logo{height:48px;object-fit:contain;max-width:175px;opacity:.88}.summary{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 10px;margin-bottom:6px}.summary-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}.summary-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#cbd3de}.summary-sub{font-size:10px;color:var(--muted);margin-top:2px}.kpis{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 14px;text-align:center;min-width:86px;cursor:pointer;transition:.15s}.kpi:hover{border-color:var(--accent);transform:translateY(-1px)}.kpi.selected{border-color:#a9b7c8;box-shadow:0 0 0 2px rgba(169,183,200,.1)}.kpi-v{font-size:18px;font-weight:700;font-family:monospace;line-height:1.15}.kpi-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.kpi.total{border-color:#465362;text-align:right}.search-row{display:flex;gap:7px;align-items:center;justify-content:flex-end}.search-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}#search{font:12px "Segoe UI",sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:7px;width:280px;outline:none;color:var(--text);background:var(--panel-soft)}#search:focus{border-color:var(--accent)}#count{font-size:11px;color:var(--muted);margin-left:4px}
    .table-wrap{overflow:auto;max-height:calc(100vh - 225px);border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1240px}thead{position:sticky;top:0;z-index:2}th{padding:9px 8px;font-size:10px;font-weight:700;text-transform:uppercase;color:#aeb9c7;text-align:left;white-space:nowrap;background:#252e3a;border-bottom:1px solid #526071;border-right:1px solid rgba(255,255,255,.035)}th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:#d6dee8;background:#2d3744}th.sortable::after{content:' ↕';color:#6f7d8e}th.sortable[data-dir="asc"]::after{content:' ↑';color:#aebdd0}th.sortable[data-dir="desc"]::after{content:' ↓';color:#aebdd0}td{padding:9px 8px;font-size:12px;color:#c5cdd8;white-space:nowrap;border-bottom:1px solid rgba(93,107,123,.36)}tr{background:var(--bg)}tbody tr:nth-child(even){background:#222a35}tbody tr:hover{background:#2b3542}tr.closed{background:#242c37}.nrc{background:#2d3948;border-left:3px solid #72869e;padding:5px 8px;border-radius:4px;color:#c4cfdd;font-weight:700}.badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:9px}.prep{background:#3b3a32;color:#c2ae79}.active{background:#2e3d39;color:#9ebcae}.closing{background:#403832;color:#c1a083}.closed-b{background:#383238;color:#b79ca6}.unknown{background:#303946;color:#9aa7b7}.course{max-width:280px;overflow:hidden;text-overflow:ellipsis}.tutor{max-width:180px;overflow:hidden;text-overflow:ellipsis}.date{font-family:monospace;color:#b8c2cf}.center{text-align:center}.actions{display:flex;gap:6px;justify-content:center}.action{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:27px;padding:0 6px;border-radius:6px;text-decoration:none;background:#2d3846;border:1px solid #465363;color:#cbd4df;font-size:13px}.action:hover{border-color:#75869a;background:#354251}.incident-ok{min-width:48px;background:#2d3c38;border-color:#49645b;color:#a9c7ba;font-size:10px;font-weight:800}.incident-alert{min-width:42px;background:#43363a;border-color:#73515a;color:#d3abb5;font-weight:800}.incident-count{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;margin-left:3px;padding:0 4px;border-radius:9px;background:#8b5965;color:#f0dce1;font-size:10px}.empty{padding:42px;text-align:center;color:var(--muted);font-size:13px}.error{padding:30px;text-align:center;background:#2a303b;border:2px dashed #765a61;border-radius:8px;margin:15px;color:#caaeb5}
    /* Tema ETOP claro */
    :root{--bg:#eef2f7;--panel:#ffffff;--panel-soft:#f8fafc;--line:#d7e0ea;--accent:#d6a900;--text:#334155;--muted:#64748b}
    html,body{background:var(--bg);color:var(--text)}
    .header{background:#fff;border-color:#d7e0ea;border-top:3px solid #d6a900;box-shadow:0 2px 8px rgba(51,65,85,.045)}
    .h-label{color:#64748b}.h-value{color:#334155}.h-value.green{color:#27815e}.h-value.code{color:#52657a}.logo{opacity:.92}
    .summary{background:#eef2f7;border-bottom-color:#d7e0ea}.summary-title{color:#475569}.summary-sub{color:#64748b}
    .kpi{background:#fff;border-color:#d7e0ea;box-shadow:0 2px 7px rgba(51,65,85,.04)}
    .kpi:hover{border-color:#c9ad3d;box-shadow:0 4px 10px rgba(51,65,85,.07)}
    .kpi.selected{border-color:#d6a900;box-shadow:0 0 0 2px rgba(214,169,0,.12)}
    .kpi[data-state="PREPARACION"]{border-top:3px solid #6884a5}.kpi[data-state="ACTIVO"]{border-top:3px solid #27815e}.kpi[data-state="EN CIERRE"]{border-top:3px solid #b97721}.kpi[data-state="CERRADO"]{border-top:3px solid #a4515d}.kpi.total{border-top:3px solid #d6a900;text-align:right}
    #k-prep{color:#506f94!important}#k-active{color:#27815e!important}#k-closing{color:#9a6018!important}#k-closed{color:#a04452!important}#k-total{color:#334155!important}
    #search{color:#334155;background:#fff;border-color:#cbd5e1}#search:focus{border-color:#c6a000;box-shadow:0 0 0 3px rgba(214,169,0,.11)}
    .table-wrap{background:#fff;border-color:#d7e0ea;box-shadow:0 3px 10px rgba(51,65,85,.045)}
    th{color:#65778b;background:#e7edf5;border-bottom-color:#cbd5e1;border-right-color:#d7e0ea}
    th.sortable:hover{color:#334155;background:#dce5ef}th.sortable::after{color:#8b9aad}th.sortable[data-dir="asc"]::after,th.sortable[data-dir="desc"]::after{color:#806600}
    td{color:#52657a;border-bottom-color:#e5ebf1}tr{background:#fff}tbody tr:nth-child(even){background:#f8fafc}tbody tr:hover{background:#f2f6fa}tr.closed{background:#f5f6f8}
    .nrc{background:#edf3f8;border-left-color:#6884a5;color:#345577}.prep{background:#eef2f7;color:#506f94}.active{background:#e8f5ef;color:#276b52}.closing{background:#fff1df;color:#925a17}.closed-b{background:#f5e9ec;color:#934454}.unknown{background:#edf1f5;color:#64748b}.date{color:#52657a}
    .action{background:#fff;border-color:#cbd5e1;color:#52657a}.action:hover{border-color:#9fb0c2;background:#f3f6fa}.incident-ok{background:#e8f5ef;border-color:#b9dfcf;color:#276b52}.incident-alert{background:#fae6e6;border-color:#efbcbc;color:#a33535}.incident-count{background:#c24141;color:#fff}
    .empty{color:#64748b}.error{background:#fff4f4;border-color:#e0aeb7;color:#a04452}.error div{color:#64748b!important}
    @media(max-width:850px){.header-grid{grid-template-columns:max-content 1fr}.logo{display:none}.table-wrap{max-height:calc(100vh - 240px)}#search{width:170px}}
  </style>
</head>
<body>
  <section class="header">
    <div class="header-grid">
      <div class="h-label">👤 TUTOR/A</div><div class="h-value up" id="h-tutor">—</div>
      <div class="h-label">📚 PROGRAMA</div><div class="h-value" id="h-programa">—</div>
      <div class="h-label">📧 CORREO</div><div class="h-value" id="h-correo">—</div>
      <div class="h-label">💻 TIPO NRC</div><div class="h-value green" id="h-tipo">—</div>
      <div class="h-label">🏷️ INTAKE</div><div class="h-value code" id="h-intake">—</div>
      <div class="h-label">🏛️ FACULTAD</div><div class="h-value" id="h-facultad">—</div>
    </div>
    <img class="logo" src="https://res.cloudinary.com/dk53pztfo/image/upload/v1771043944/ChatGPT_Image_13_feb_2026_10_56_20_p.m._lf5z44.png" alt="Logo ETOP">
  </section>

  <section class="summary">
    <div class="summary-row">
      <div><div class="summary-title">Resumen de Cursos</div><div class="summary-sub" id="subtitle">ETOP · cargando cursos…</div></div>
      <div class="kpis">
        <div class="kpi" data-state="PREPARACION"><div class="kpi-v" style="color:#9bafc8" id="k-prep">0</div><div class="kpi-l">Prep.</div></div>
        <div class="kpi" data-state="ACTIVO"><div class="kpi-v" style="color:#75b79c" id="k-active">0</div><div class="kpi-l">Activos</div></div>
        <div class="kpi" data-state="EN CIERRE"><div class="kpi-v" style="color:#c8a06e" id="k-closing">0</div><div class="kpi-l">Cierre</div></div>
        <div class="kpi" data-state="CERRADO"><div class="kpi-v" style="color:#c88995" id="k-closed">0</div><div class="kpi-l">Cerrados</div></div>
        <div class="kpi total" data-state=""><div class="kpi-l">Total</div><div class="kpi-v" style="color:#d6e3f3" id="k-total">0</div></div>
      </div>
    </div>
    <div class="search-row"><span class="search-label">Buscar</span><input id="search" type="text" placeholder="NRC, curso, tutor…"><span id="count"></span></div>
  </section>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="sortable" data-sort="nrc">NRC_COD_CAL</th><th class="sortable" data-sort="estado">Estado</th><th class="sortable" data-sort="nombre curso">Nombre curso</th><th class="sortable" data-sort="facultad">Facultad</th><th class="sortable" data-sort="fecha inicio">F. inicio</th><th class="sortable" data-sort="fecha fin">F. fin</th><th class="sortable center" data-sort="semanas">Semanas</th><th class="sortable" data-sort="tutor">Tutor/a</th><th class="sortable" data-sort="tipo">Tipo</th><th class="sortable" data-sort="periodo">Periodo</th><th class="center">Acciones</th></tr></thead>
      <tbody id="rows"><tr><td colspan="11" class="empty">Cargando calendarios…</td></tr></tbody>
    </table>
  </div>

  <script>
    const SP_BASE='https://unabportal365.sharepoint.com/sites/actasynrc/Lists/NRC_TUTOR_ACTUAL/DispForm.aspx?ID=';
    const BASE='https://tutoriaonlinepostgrado.github.io/sitiowebetop/';
    const EMAILS={
      'HANS NOVAKOVIC':'tutoriaonline45@unab.cl','KIMBERLY JORQUERA':'tutoriaonline52@unab.cl','MARTA GONZALEZ':'marta.gonzalez@unab.cl','DANITZA JANSEN':'danitza.jansen@unab.cl','SYLVIA VALENZUELA':'sylvia.valenzuela@unab.cl','PAULA PARDO':'tutoriaonline82@unab.cl','MARIA FERNANDA GONZALEZ':'tutoriaonline41@unab.cl','BARBARA ROJAS':'barbara.rojas.c@unab.cl','CONSTANZA CONTRERAS':'tutoriaonline56@unab.cl','CARLA PENA':'tutoriaonline54@unab.cl','NOEMI PAZ':'tutoriaonline08@unab.cl','ORIETTA CORTES':'tutoriaonline04@unab.cl','HECTOR TAPIA':'tutoriaonline23@unab.cl','CONSUELO PARGA':'tutoriaonline70@unab.cl','FRANCISCA INDA':'tutoriaonline75@unab.cl','JAVIERA ROJAS':'tutoriaonline76@unab.cl','ALYSON HERNANDEZ':'tutoriaonline72@unab.cl'
    };
    const q=new URLSearchParams(location.search);let courses=[];let incidents=[];let stateFilter='';let sortKey='fecha inicio';let sortDir='asc';
    const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uniq=(arr,key)=>[...new Set(arr.map(x=>String(x[key]??'').trim()).filter(Boolean))];
    const selected=(arr,key,multi,empty='No disponible')=>{const v=uniq(arr,key);return v.length===1?v[0]:(v.length>1?multi:empty)};
    const dateValue=v=>{if(!v)return null;const d=new Date(String(v).slice(0,10)+'T00:00:00');return Number.isNaN(d.getTime())?null:d};
    const fmtDate=v=>{const d=dateValue(v);return d?`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`:'—'};
    const weeks=(a,b)=>{const x=dateValue(a),y=dateValue(b);return x&&y?Math.ceil((y-x)/604800000)+' sem.':'—'};
    const qList=key=>(q.get(key)||'').split('|').map(norm).filter(Boolean);
    function filterCourses(data){const facultades=qList('facultad'),tutores=qList('tutor'),tipos=qList('tipo'),estados=qList('estado'),intakes=qList('intake');return data.filter(x=>(!facultades.length||facultades.includes(norm(x.facultad)))&&(!tutores.length||tutores.includes(norm(x.tutor)))&&(!tipos.length||tipos.includes(norm(x.tipo)))&&(!estados.length||estados.includes(norm(x.estado)))&&(!intakes.length||intakes.includes(norm(x.intake)))&&(!q.get('nrc')||norm(x.nrc)===norm(q.get('nrc'))));}
    function updateHeader(){
      const tutor=selected(courses,'tutor','Varios / No definido');
      document.getElementById('h-tutor').textContent=tutor;
      document.getElementById('h-programa').textContent=selected(courses,'nombre programa','Múltiples programas');
      document.getElementById('h-correo').textContent=uniq(courses,'tutor').length===1?(EMAILS[norm(tutor)]||'No disponible'):'No disponible';
      document.getElementById('h-tipo').textContent=selected(courses,'tipo','Varios');
      document.getElementById('h-intake').textContent=selected(courses,'intake','Múltiples versiones');
      document.getElementById('h-facultad').textContent=selected(courses,'facultad','Varias');
    }
    function badge(state){const s=norm(state);if(s==='PREPARACION')return['PREP','prep'];if(s==='ACTIVO')return['ACTIVO','active'];if(s==='EN CIERRE')return['CIERRE','closing'];if(s==='CERRADO')return['CERRADO','closed-b'];return[state||'—','unknown'];}
    function action(url,title,icon,enabled=true){return enabled?`<a class="action" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}">${icon}</a>`:'';}
    function buildIncidentMaps(){const byCourse=new Map();incidents.forEach(i=>{const k=String(i.cursoId??'');if(!byCourse.has(k))byCourse.set(k,[]);byCourse.get(k).push(i)});return byCourse;}
    function render(){
      const byCourse=buildIncidentMaps();const body=document.getElementById('rows');
      updateHeader();updateKPIs();
      if(!courses.length){body.innerHTML='<tr><td colspan="11" class="empty">No hay cursos para los filtros seleccionados.</td></tr>';updateHeader();updateKPIs();return;}
      const shown=sortCourses(courses.filter(x=>!stateFilter||norm(x.estado)===stateFilter));
      if(shown.length>3000){body.innerHTML=`<tr><td colspan="11"><div class="error"><div style="font-size:35px;margin-bottom:5px">⚠️</div><strong>Demasiados registros (${shown.length.toLocaleString('es-CL')})</strong><div style="font-size:12px;color:#bfc8d5;margin-top:8px">Selecciona un KPI o utiliza los filtros superiores de Gestión para acotar los resultados.</div></div></td></tr>`;document.getElementById('count').textContent='';return;}
      body.innerHTML=shown.map(x=>{const b=badge(x.estado);const inc=byCourse.get(String(x.id))||[];const canvas=(inc.find(i=>String(i.urlCanvas||'').trim())||{}).urlCanvas||'';const incidentCount=inc.filter(i=>norm(i.qaIncidencias)==='CON INCIDENCIA').length;const incidentUrl=BASE+'incidencias.html?nrc='+encodeURIComponent(x.nrc||'');const incidentAction=!inc.length?'':incidentCount?`<a class="action incident-alert" href="${esc(incidentUrl)}" target="_blank" rel="noopener" title="${incidentCount} incidencia${incidentCount===1?'':'s'} registrada${incidentCount===1?'':'s'}">⚠<span class="incident-count">${incidentCount}</span></a>`:`<a class="action incident-ok" href="${esc(incidentUrl)}" target="_blank" rel="noopener" title="Registro revisado: sin incidencias">✓ OK</a>`;const p=new URLSearchParams({nombreTutor:x.tutor||'',nombreCurso:x['nombre curso']||'',nrc:x.nrc||'',fechaInicio:x['fecha inicio']||'',fechaFin:x['fecha fin']||''});const actions=[action(SP_BASE+x.id,'Ver curso en base calendarios','📋'),action(canvas,'Ver el curso en Canvas','🖥',!!canvas),action(BASE+'presentacion_tutorial_innovado.html?'+p,'Presentación Tutorial','📊'),action(BASE+'comunicaciones_etop.html','Hub Comunicaciones','✉️'),incidentAction].join('');return `<tr class="${norm(x.estado)==='CERRADO'?'closed':''}" data-search="${esc(norm([x.nrc,x['nombre curso'],x.tutor,x.facultad,x.intake,x.periodo].join(' ')))}"><td><span class="nrc">${esc(x.nrc||'—')}</span></td><td><span class="badge ${b[1]}">${esc(b[0])}</span></td><td class="course" title="${esc(x['nombre curso']||'')}">${esc(String(x['nombre curso']||'—').replace(/\*/g,''))}</td><td>${esc(x.facultad||'—')}</td><td class="date">${fmtDate(x['fecha inicio'])}</td><td class="date">${fmtDate(x['fecha fin'])}</td><td class="center">${weeks(x['fecha inicio'],x['fecha fin'])}</td><td class="tutor" title="${esc(x.tutor||'')}">${esc(x.tutor||'—')}</td><td>${esc(x.tipo||'—')}</td><td>${esc(x.periodo||'—')}</td><td><div class="actions">${actions}</div></td></tr>`}).join('');updateSortHeaders();applySearch();
    }
    function sortCourses(list){return [...list].sort((a,b)=>{let av,bv;if(sortKey==='semanas'){const x=dateValue(a['fecha inicio']),y=dateValue(a['fecha fin']),u=dateValue(b['fecha inicio']),v=dateValue(b['fecha fin']);av=x&&y?y-x:-1;bv=u&&v?v-u:-1}else if(sortKey==='fecha inicio'||sortKey==='fecha fin'){av=dateValue(a[sortKey])?.getTime()||0;bv=dateValue(b[sortKey])?.getTime()||0}else{av=norm(a[sortKey]);bv=norm(b[sortKey])}const c=typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'es',{numeric:true});return sortDir==='asc'?c:-c})}
    function updateSortHeaders(){document.querySelectorAll('th[data-sort]').forEach(th=>{if(th.dataset.sort===sortKey)th.dataset.dir=sortDir;else delete th.dataset.dir})}
    function updateKPIs(){const count=s=>courses.filter(x=>norm(x.estado)===s).length;const n=courses.length;document.getElementById('k-prep').textContent=count('PREPARACION').toLocaleString('es-CL');document.getElementById('k-active').textContent=count('ACTIVO').toLocaleString('es-CL');document.getElementById('k-closing').textContent=count('EN CIERRE').toLocaleString('es-CL');document.getElementById('k-closed').textContent=count('CERRADO').toLocaleString('es-CL');document.getElementById('k-total').textContent=n.toLocaleString('es-CL');document.getElementById('subtitle').textContent=`ETOP · ${n.toLocaleString('es-CL')} cursos en listado`;document.querySelectorAll('.kpi[data-state]').forEach(k=>k.classList.toggle('selected',k.dataset.state===stateFilter));}
    function applySearch(){const s=norm(document.getElementById('search').value);const rows=[...document.querySelectorAll('#rows tr[data-search]')];let visible=0;rows.forEach(r=>{const ok=!s||r.dataset.search.includes(s);r.style.display=ok?'':'none';if(ok)visible++});document.getElementById('count').textContent=`${visible} de ${rows.length} cursos`;}
    document.getElementById('search').addEventListener('input',applySearch);
    document.querySelectorAll('.kpi[data-state]').forEach(k=>k.addEventListener('click',()=>{stateFilter=k.dataset.state;render()}));
    document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.sort;if(sortKey===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=key;sortDir='asc'}render()}));
    Promise.all([fetch('nrcs.json',{cache:'no-store'}),fetch('incidencias.json',{cache:'no-store'})]).then(async([nr,ir])=>{if(!nr.ok)throw new Error('No se pudo leer nrcs.json');courses=filterCourses(await nr.json());incidents=ir.ok?await ir.json():[];render();}).catch(err=>{document.getElementById('rows').innerHTML=`<tr><td colspan="11"><div class="error">⚠️ ${esc(err.message)}</div></td></tr>`;});
  </script>
</body>
</html>
