    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uniq=(arr,key)=>[...new Set(arr.map(x=>String(x[key]??'').trim()).filter(Boolean))];
    const selected=(arr,key,multi,empty='No disponible')=>{const v=uniq(arr,key);return v.length===1?v[0]:(v.length>1?multi:empty)};
    const dateValue=v=>{if(!v)return null;const d=new Date(String(v).slice(0,10)+'T00:00:00');return Number.isNaN(d.getTime())?null:d};
    const dateISO=v=>{const d=dateValue(v);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''};
    const fmtDate=v=>{const d=dateValue(v);return d?`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`:'—'};
    const weeks=(a,b)=>{const x=dateValue(a),y=dateValue(b);return x&&y?Math.ceil((y-x)/604800000)+' sem.':'—'};
    const qList=key=>(q.get(key)||'').split('|').map(norm).filter(Boolean);
    function filterCourses(data,{ignoreNrc=false}={}){const facultades=qList('facultad'),tutores=qList('tutor'),tipos=qList('tipo'),estados=qList('estado'),intakes=qList('intake'),fechasInicio=qList('fechaInicio');return data.filter(x=>(!facultades.length||facultades.includes(norm(x.facultad)))&&(!tutores.length||tutores.includes(norm(x.tutor)))&&(!tipos.length||tipos.includes(norm(x.tipo)))&&(!estados.length||estados.includes(norm(x.estado)))&&(!intakes.length||intakes.includes(norm(x.intake)))&&(!fechasInicio.length||fechasInicio.includes(norm(dateISO(x['fecha inicio']))))&&(ignoreNrc||!q.get('nrc')||norm(x.nrc)===norm(q.get('nrc'))));}
    function reconstruirUniversoDesdeFicha(){
      const explorando=Object.values(detailFilters).some(Boolean);
      courses=filterCourses(allCourses,{ignoreNrc:explorando});
    }
    function updateHeader(list=courses){
      const tutor=selected(list,'tutor','Varios / No definido');
      document.getElementById('h-tutor').textContent=tutor;
      document.getElementById('h-programa').textContent=selected(list,'nombre programa','Múltiples programas');
      document.getElementById('h-correo').textContent=uniq(list,'tutor').length===1?(EMAILS[norm(tutor)]||'No disponible'):'No disponible';
      document.getElementById('h-tipo').textContent=selected(list,'tipo','Varios');
      document.getElementById('h-intake').textContent=selected(list,'intake','Múltiples versiones');
      document.getElementById('h-facultad').textContent=selected(list,'facultad','Varias');
    }
    function badge(state){const s=norm(state);if(s==='PREPARACION')return['PREP','prep'];if(s==='ACTIVO')return['ACTIVO','active'];if(s==='EN CIERRE')return['CIERRE','closing'];if(s==='CERRADO')return['CERRADO','closed-b'];return[state||'—','unknown'];}
    function action(url,title,icon,enabled=true){return enabled?`<a class="action" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}">${icon}</a>`:'';}
    function buildIncidentMaps(){const byCourse=new Map();incidents.forEach(i=>{const k=String(i.cursoId??'');if(!byCourse.has(k))byCourse.set(k,[]);byCourse.get(k).push(i)});return byCourse;}
    function detailFilteredCourses(){
      return courses.filter(x =>
        (!detailFilters.tutor || norm(x.tutor)===norm(detailFilters.tutor)) &&
        (!detailFilters.intake || norm(x.intake)===norm(detailFilters.intake)) &&
        (!detailFilters.estado || norm(x.estado)===norm(detailFilters.estado)) &&
        (!detailFilters.facultad || norm(x.facultad)===norm(detailFilters.facultad)) &&
        (!detailFilters.codigo || norm(x['codigo curso'])===norm(detailFilters.codigo))
      );
    }
    function studentsUrl(nrc){
      const u=new URL('https://unabportal365.sharepoint.com/sites/actasynrc/Lists/BASESEMAFORO_20/Todosloselementos.aspx');
      u.searchParams.set('FilterField1','NRC_COD_CAL');
      u.searchParams.set('FilterValue1',String(nrc||''));
      u.searchParams.set('FilterType1','Calculated');
      u.searchParams.set('viewid','1f85f1c7-089f-47d6-8635-a2cc761fecc3');
      u.searchParams.set('env','Embedded');
      return u.href;
    }
    function integrationUrl(nrc){
      const s=String(nrc||'').split('_'),period=s[s.length-1]||'',crn=s[0]||'';
      return crn&&period?'https://lms.unab.cl/int-canvas/?'+new URLSearchParams({term_code:period,periodo:period,nrc:crn,nrc_code:crn,crn,NRC:crn}).toString():'';
    }
    function powerAppsUrl(x){
      const u=new URL(POWER_APPS_EDITOR_URL);
      if(String(x.id||'').trim())u.searchParams.set('ids',String(x.id).trim());
      return u.toString();
    }
    function qa2Url(x){
      const u=new URL(FORM_URL);
      if(String(x.id||'').trim())u.searchParams.set(FORM_COURSE_FIELD,String(x.id).trim());
      return u.toString();
    }
    function presentationUrl(x){
      const p=new URLSearchParams({nombreTutor:x.tutor||'',nombreCurso:x['nombre curso']||'',nrc:x.nrc||'',fechaInicio:x['fecha inicio']||'',fechaFin:x['fecha fin']||''});
      return BASE+'presentacion_tutorial_innovado.html?'+p.toString();
    }
    function announcementUrl(x){
      const p=new URLSearchParams({nombre_tutor:x.tutor||'',nombre_curso:x['nombre curso']||'',fecha_inicio:fmtDate(x['fecha inicio']),fecha_fin:fmtDate(x['fecha fin'])});
      return BASE+'anuncio_bienvenida_curso_malla.html?'+p.toString();
    }
    function panelLink(url,icon,texto,primary=false){
      const enabled=Boolean(url);
      return `<a class="panel-action ${primary?'primary ':''}${enabled?'':'disabled'}" href="${enabled?esc(url):'#'}" ${enabled?'target="_blank" rel="noopener"':''}><span class="pa-icon">${icon}</span><span>${esc(texto)}</span></a>`;
    }
    function aplicarFiltroFicha(campo,valor){
      if(!valor)return;
      const mismo=norm(detailFilters[campo])===norm(valor);
      detailFilters[campo]=mismo?'':valor;

      // La ficha se comporta como el Explorador: al navegar por un dato,
      // el texto de búsqueda deja de limitar el resultado al NRC original.
      const search=document.getElementById('search');
      if(search)search.value='';
      stateFilter='';

      reconstruirUniversoDesdeFicha();
      render();
      const seleccionado=allCourses.find(x=>norm(x.nrc)===norm(selectedCourseNrc));
      if(seleccionado)renderCoursePanel(seleccionado);
    }
    function limpiarFiltrosFicha(){
      Object.keys(detailFilters).forEach(k=>detailFilters[k]='');
      reconstruirUniversoDesdeFicha();
      render();
      const seleccionado=allCourses.find(x=>norm(x.nrc)===norm(selectedCourseNrc));
      if(seleccionado)renderCoursePanel(seleccionado);
    }
    function metaFilterButton(campo,label,valor){
      if(!valor)return '';
      const activo=norm(detailFilters[campo])===norm(valor);
      return `<button type="button" class="course-meta-filter ${activo?'active':''}" title="Filtrar calendario por ${esc(label)}: ${esc(valor)}" onclick="aplicarFiltroFicha('${campo}',decodeURIComponent('${encodeURIComponent(valor)}'))"><span class="course-meta-label">${esc(label)}</span><span class="course-meta-value">${activo?'✓ ':''}${esc(valor)}</span></button>`;
    }
    function renderCoursePanel(x){
      const panel=document.getElementById('course-panel'),host=document.getElementById('course-panel-content');
      if(!x){panel.classList.remove('open');host.innerHTML='';return;}
      const byCourse=buildIncidentMaps(),inc=byCourse.get(String(x.id))||[];
      const canvas=(inc.find(i=>String(i.urlCanvas||'').trim())||{}).urlCanvas||'';
      const incidentCount=inc.filter(i=>norm(i.qaIncidencias)==='CON INCIDENCIA').length;
      const incidentStatus=norm(x['codigo curso'])==='UNI118'?'NO APLICA':!inc.length?'PENDIENTE QA2':incidentCount?`CON INCIDENCIA (${incidentCount})`:'SIN INCIDENCIA';
      const incidentUrl=BASE+'incidencias.html?nrc='+encodeURIComponent(x.nrc||'');
      host.innerHTML=`
        <div class="course-panel-head">
          <div>
            <div class="course-panel-kicker">Accesos y ficha del curso</div>
            <div class="course-panel-nrc">${esc(x.nrc||'—')}</div>
            <div class="course-panel-course">${esc(String(x['nombre curso']||'—').replace(/\*/g,''))}</div>
            <div class="course-meta-grid">
              ${metaFilterButton('tutor','Tutor',x.tutor||'')}
              ${metaFilterButton('intake','Intake / Versión',x.intake||'')}
              ${metaFilterButton('estado','Estado',x.estado||'')}
              ${metaFilterButton('facultad','Facultad',x.facultad||'')}
              ${metaFilterButton('codigo','Código curso',x['codigo curso']||'')}
            </div>
            ${Object.values(detailFilters).some(Boolean)?'<button type="button" class="course-filter-clear" onclick="limpiarFiltrosFicha()">Quitar filtros aplicados desde la ficha</button>':''}
          </div>
          <button type="button" class="course-panel-close" onclick="cerrarFichaCurso()" title="Cerrar">×</button>
        </div>
        <div class="course-panel-body">
          <div class="panel-section">
            <div class="panel-section-title">Gestión del curso</div>
            <div class="panel-actions-grid">
              <button type="button" class="panel-action primary ${String(x.id||'').trim()?'':'disabled'}" onclick="abrirPowerAppsEnFicha()" ${String(x.id||'').trim()?'':'disabled'}><span class="pa-icon">✏️</span><span>Editar curso en Power Apps</span></button>
              ${panelLink(studentsUrl(x.nrc),'👥','Base Semáforo / estudiantes')}
            </div>
          </div>
          <div class="panel-section">
            <div class="panel-section-title">Canvas y seguimiento</div>
            <div class="panel-actions-grid">
              ${panelLink(canvas,'🎓','Abrir curso en Canvas')}
              ${panelLink(integrationUrl(x.nrc),'🌐','Verificar integración Canvas')}
              ${panelLink(incidentUrl,'⚠️','Incidencias / QA2')}
              ${panelLink(String(x.id||'').trim()?qa2Url(x):'','✅','Formulario QA2')}
            </div>
            <div class="panel-status" style="margin-top:7px"><span>Estado QA2 / incidencias</span><strong>${esc(incidentStatus)}</strong></div>
          </div>
          <div class="panel-section">
            <div class="panel-section-title">Acompañamiento y comunicaciones</div>
            <div class="panel-actions-grid">
              ${panelLink(presentationUrl(x),'📊','Presentación Tutorial')}
              ${panelLink(BASE+'comunicaciones_etop.html','✉️','Hub Comunicaciones')}
              ${panelLink(announcementUrl(x),'📣','Anuncio bienvenida curso')}
            </div>
          </div>
        </div>`;
      panel.classList.add('open');
    }
    function abrirPowerAppsEnFicha(){
      const x=allCourses.find(c=>norm(c.nrc)===norm(selectedCourseNrc));
      if(!x||!String(x.id||'').trim())return;
      const panel=document.getElementById('course-panel'),host=document.getElementById('course-panel-content');
      const url=powerAppsUrl(x);
      host.innerHTML=`
        <div class="course-panel-head">
          <div><div class="course-panel-kicker">Editor Power Apps</div><div class="course-panel-nrc">${esc(x.nrc||'—')}</div><div class="course-panel-course">${esc(String(x['nombre curso']||'—').replace(/\*/g,''))}</div></div>
          <button type="button" class="course-panel-close" onclick="cerrarFichaCurso()" title="Cerrar">×</button>
        </div>
        <div class="powerapp-panel-view">
          <div class="powerapp-panel-toolbar">
            <button type="button" class="powerapp-back" onclick="volverFichaCurso()">← Volver a la ficha</button>
            <a class="powerapp-external" href="${esc(url)}" target="_blank" rel="noopener">Abrir aparte ↗</a>
          </div>
          <div class="powerapp-open-note">Edición del registro seleccionado sin salir de Calendarios.</div>
          <iframe class="powerapp-iframe" src="${esc(url)}" title="Editor de curso Power Apps" allow="clipboard-read; clipboard-write"></iframe>
        </div>`;
      panel.classList.add('open');
    }
    function volverFichaCurso(){
      const x=allCourses.find(c=>norm(c.nrc)===norm(selectedCourseNrc));
      if(x)renderCoursePanel(x);
    }
    function abrirFichaCurso(nrc,event){
      if(event && event.target.closest('a,button,input'))return;
      const x=allCourses.find(c=>norm(c.nrc)===norm(nrc));
      if(!x)return;
      selectedCourseNrc=x.nrc||'';
      renderCoursePanel(x);
      document.querySelectorAll('#rows tr[data-nrc]').forEach(tr=>tr.classList.toggle('row-selected',norm(decodeURIComponent(tr.dataset.nrc||''))===norm(selectedCourseNrc)));
    }
    function abrirPowerAppsDesdeTabla(nrc,event){
      if(event)event.stopPropagation();
      const x=allCourses.find(c=>norm(c.nrc)===norm(nrc));
      if(!x||!String(x.id||'').trim())return;
      selectedCourseNrc=x.nrc||'';
      document.querySelectorAll('#rows tr[data-nrc]').forEach(tr=>tr.classList.toggle('row-selected',norm(decodeURIComponent(tr.dataset.nrc||''))===norm(selectedCourseNrc)));
      renderCoursePanel(x);
      abrirPowerAppsEnFicha();
    }
    function cerrarFichaCurso(){
      selectedCourseNrc='';
      document.getElementById('course-panel').classList.remove('open');
      document.getElementById('course-panel-content').innerHTML='';
      document.querySelectorAll('#rows tr.row-selected').forEach(tr=>tr.classList.remove('row-selected'));
    }

    function render(){
      const byCourse=buildIncidentMaps();const body=document.getElementById('rows');
      const panelCourses=detailFilteredCourses();
      updateHeader(panelCourses);updateKPIs(panelCourses);
      if(!panelCourses.length){body.innerHTML='<tr><td colspan="11" class="empty">No hay cursos para los filtros seleccionados.</td></tr>';document.getElementById('count').textContent='0 cursos';return;}
      const shown=sortCourses(panelCourses.filter(x=>!stateFilter||norm(x.estado)===stateFilter));
      if(shown.length>3000){body.innerHTML=`<tr><td colspan="11"><div class="error"><div style="font-size:35px;margin-bottom:5px">⚠️</div><strong>Demasiados registros (${shown.length.toLocaleString('es-CL')})</strong><div style="font-size:12px;color:#bfc8d5;margin-top:8px">Selecciona un KPI o utiliza los filtros superiores de Gestión para acotar los resultados.</div></div></td></tr>`;document.getElementById('count').textContent='';return;}
      body.innerHTML=shown.map(x=>{const b=badge(x.estado);const powerAppsAction=String(x.id||'').trim()?`<button type="button" class="action powerapps-table" title="Editar curso" onclick="abrirPowerAppsDesdeTabla(decodeURIComponent(this.closest('tr').dataset.nrc),event)">✏️ Editar curso</button>`:'';return `<tr class="${norm(x.estado)==='CERRADO'?'closed':''}${norm(x.nrc)===norm(selectedCourseNrc)?' row-selected':''}" data-nrc="${esc(encodeURIComponent(x.nrc||''))}" onclick="abrirFichaCurso(decodeURIComponent(this.dataset.nrc),event)" data-search="${esc(norm([x.nrc,x['nombre curso'],x.tutor,x.facultad,x.intake,x.periodo].join(' ')))}"><td><span class="nrc">${esc(x.nrc||'—')}</span></td><td><span class="badge ${b[1]}">${esc(b[0])}</span></td><td class="course" title="${esc(x['nombre curso']||'')}">${esc(String(x['nombre curso']||'—').replace(/\*/g,''))}</td><td>${esc(x.facultad||'—')}</td><td class="date">${fmtDate(x['fecha inicio'])}</td><td class="date">${fmtDate(x['fecha fin'])}</td><td class="center">${weeks(x['fecha inicio'],x['fecha fin'])}</td><td class="tutor" title="${esc(x.tutor||'')}">${esc(x.tutor||'—')}</td><td>${esc(x.tipo||'—')}</td><td>${esc(x.periodo||'—')}</td><td><div class="actions">${powerAppsAction}</div></td></tr>`}).join('');updateSortHeaders();applySearch();
    }
    function sortCourses(list){return [...list].sort((a,b)=>{let av,bv;if(sortKey==='semanas'){const x=dateValue(a['fecha inicio']),y=dateValue(a['fecha fin']),u=dateValue(b['fecha inicio']),v=dateValue(b['fecha fin']);av=x&&y?y-x:-1;bv=u&&v?v-u:-1}else if(sortKey==='fecha inicio'||sortKey==='fecha fin'){av=dateValue(a[sortKey])?.getTime()||0;bv=dateValue(b[sortKey])?.getTime()||0}else{av=norm(a[sortKey]);bv=norm(b[sortKey])}const c=typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'es',{numeric:true});return sortDir==='asc'?c:-c})}
    function updateSortHeaders(){document.querySelectorAll('th[data-sort]').forEach(th=>{if(th.dataset.sort===sortKey)th.dataset.dir=sortDir;else delete th.dataset.dir})}
    function updateKPIs(list=courses){const count=s=>list.filter(x=>norm(x.estado)===s).length;const n=list.length;document.getElementById('k-prep').textContent=count('PREPARACION').toLocaleString('es-CL');document.getElementById('k-active').textContent=count('ACTIVO').toLocaleString('es-CL');document.getElementById('k-closing').textContent=count('EN CIERRE').toLocaleString('es-CL');document.getElementById('k-closed').textContent=count('CERRADO').toLocaleString('es-CL');document.getElementById('k-total').textContent=n.toLocaleString('es-CL');document.getElementById('subtitle').textContent=`ETOP · ${n.toLocaleString('es-CL')} cursos en listado`;document.querySelectorAll('.kpi[data-state]').forEach(k=>k.classList.toggle('selected',k.dataset.state===stateFilter));}
    function applySearch(){const s=norm(document.getElementById('search').value);const rows=[...document.querySelectorAll('#rows tr[data-search]')];let visible=0;rows.forEach(r=>{const ok=!s||r.dataset.search.includes(s);r.style.display=ok?'':'none';if(ok)visible++});document.getElementById('count').textContent=`${visible} de ${rows.length} cursos`;}
    function cursosVisibles(){const s=norm(document.getElementById('search').value);return sortCourses(detailFilteredCourses().filter(x=>(!stateFilter||norm(x.estado)===stateFilter)&&(!s||norm([x.nrc,x['nombre curso'],x.tutor,x.facultad,x.intake,x.periodo].join(' ')).includes(s))));}
    function descargarExcel(){const lista=cursosVisibles();if(!lista.length){alert('No hay cursos visibles para descargar.');return;}const filas=lista.map(x=>({'NRC_COD_CAL':x.nrc||'','ESTADO':x.estado||'','COD_CURSO':x['codigo curso']||'','MATERIA':x.materia||'','NOMBRE_CURSO':x['nombre curso']||'','PROGRAMA':x['nombre programa']||'','FACULTAD':x.facultad||'','FECHA_INICIO':dateISO(x['fecha inicio']),'FECHA_FIN':dateISO(x['fecha fin']),'SEMANAS':weeks(x['fecha inicio'],x['fecha fin']),'TUTOR':x.tutor||'','TIPO_NRC':x.tipo||'','INTAKE_VERSION':x.intake||'','PERIODO':x.periodo||''}));const ws=XLSX.utils.json_to_sheet(filas);ws['!autofilter']={ref:ws['!ref']};ws['!cols']=[{wch:20},{wch:14},{wch:15},{wch:13},{wch:42},{wch:48},{wch:20},{wch:14},{wch:14},{wch:10},{wch:28},{wch:14},{wch:34},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Calendarios filtrados');XLSX.writeFile(wb,'Calendarios_ETOP_filtrados_'+new Date().toISOString().slice(0,10)+'.xlsx',{compression:true});}
    document.getElementById('search').addEventListener('input',applySearch);
    document.querySelectorAll('.kpi[data-state]').forEach(k=>k.addEventListener('click',()=>{stateFilter=k.dataset.state;render()}));
    document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.sort;if(sortKey===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=key;sortDir='asc'}render()}));
    Promise.all([fetch('nrcs.json',{cache:'no-store'}),fetch('incidencias.json',{cache:'no-store'})]).then(async([nr,ir])=>{if(!nr.ok)throw new Error('No se pudo leer nrcs.json');allCourses=await nr.json();courses=filterCourses(allCourses);incidents=ir.ok?await ir.json():[];render();}).catch(err=>{document.getElementById('rows').innerHTML=`<tr><td colspan="11"><div class="error">⚠️ ${esc(err.message)}</div></td></tr>`;});
  </script>
</body>
</html>
